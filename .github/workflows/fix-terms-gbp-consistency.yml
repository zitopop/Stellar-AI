name: Align Terms with GBP billing
on:
  push:
    branches:
      - fix/terms-gbp-consistency
    paths:
      - .github/workflows/fix-terms-gbp-consistency.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/terms-gbp-consistency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Terms correction
        run: python scripts/_tmp_fix_terms_gbp.py
      - name: Install dependencies without rewriting lockfile
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Run full test suite
        run: node --test tests/*.test.mjs
      - name: Verify diff
        run: git diff --check
      - name: Commit verified Terms changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add terms.html tests/gbp-display-contract.test.mjs
          git commit -m "Align Terms with GBP-only billing"
          git push origin fix/terms-gbp-consistency
