name: Clean growth branch artifacts

on:
  push:
    branches:
      - growth/conversion-pass

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth/conversion-pass
          fetch-depth: 0

      - name: Remove temporary dependency artifacts
        run: |
          rm -rf node_modules
          rm .github/workflows/cleanup-growth-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary dependency artifacts"
          git push origin HEAD:growth/conversion-pass
