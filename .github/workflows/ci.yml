name: Stellar AI CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stellar-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Source syntax and regression tests
        run: npm run check
      - name: Validate critical public files
        shell: bash
        run: |
          set -euo pipefail
          required=(index.html app.html support.html blog.html manifest.json sitemap.xml vercel.json README.md)
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty critical file: $file"; exit 1; }
          done
      - name: Check for obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' --exclude='*.test.mjs' \
            '(sk_live_[A-Za-z0-9]{16,}|sk-proj-[A-Za-z0-9_-]{16,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo "Potential secret detected in committed source."
            exit 1
          fi
          echo "No obvious committed secret patterns found."
