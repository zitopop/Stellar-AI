name: Stellar Call Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ring-due-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger due Stellar calls
        run: |
          curl --fail-with-body --silent --show-error             --retry 2 --retry-delay 2             -H "X-Stellar-Scheduler: github-actions"             -H "User-Agent: Stellar-Call-Scheduler/1.0"             "https://trystellarai.com/api/broadcast?action=stellarCallWorker"
