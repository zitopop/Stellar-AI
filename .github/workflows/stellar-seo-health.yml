name: Stellar AI SEO health

on:
  schedule:
    # Mondays 08:23 UTC (09:23 BST / 08:23 GMT)
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-organic-search:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Check public crawlability, canonical URLs and sitemaps
        id: seo
        continue-on-error: true
        run: python3 scripts/seo_health_check.py

      - name: Record any SEO errors as an issue
        if: steps.seo.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="SEO health check failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="The automatic public Google crawl-readiness check found a problem. Review the job log and fix the specific URL, sitemap or metadata error.\n\nWorkflow run: ${RUN_URL}\n\nThis is an SEO health warning, not proof that Google has deindexed the site."
          NUMBER="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "SEO health check failed") | .number' | head -n 1)"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$(printf '%b' "$BODY")"
          else
            gh issue create --title "$TITLE" --body "$(printf '%b' "$BODY")"
          fi

      - name: Fail run when SEO health failed
        if: steps.seo.outcome == 'failure'
        run: exit 1
