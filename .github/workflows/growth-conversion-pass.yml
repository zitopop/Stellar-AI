name: Verify growth conversion pass

on:
  push:
    branches:
      - growth/conversion-pass

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth/conversion-pass
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply conversion UX pass
        run: node scripts/apply-growth-conversion-pass.mjs

      - name: Install test dependencies without rewriting lockfile
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Run full test suite
        run: node --test tests/*.test.mjs

      - name: Verify checkout and conversion contracts
        run: |
          node --check api/create-checkout.js
          node <<'NODE'
          const fs = require('fs');
          const landing = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('app.html', 'utf8');
          const checkout = fs.readFileSync('api/create-checkout.js', 'utf8');
          const failures = [];
          if (!landing.includes('link.href = `/app?upgrade=${plan}`;')) failures.push('runtime landing upgrade route missing');
          for (const plan of ['starter','plus','pro']) {
            if (!app.includes(`plan-card-${plan}`) || !app.includes(`plan-btn-${plan}`)) failures.push(`app plan target missing ${plan}`);
          }
          for (const token of ['STRIPE_SECRET_KEY','checkout.sessions.create','success_url','cancel_url']) {
            if (!checkout.includes(token)) failures.push(`checkout contract missing ${token}`);
          }
          if (!app.includes("url.searchParams.delete('upgrade')")) failures.push('upgrade query cleanup missing');
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log('PASS paid-plan intent routing and checkout contract');
          NODE
          git diff --check

      - name: Remove one-off automation files
        run: |
          rm scripts/apply-growth-conversion-pass.mjs
          rm .github/workflows/growth-conversion-pass.yml

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve paid-plan conversion handoff"
          git push origin HEAD:growth/conversion-pass
