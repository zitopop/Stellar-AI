name: Settings extension check

on:
  push:
    branches:
      - feat/settings-extensible-preferences-v1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Settings extension contract
        run: node --test tests/settings-extensions.test.mjs
