name: Stellar Pages Static Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'blog/**'
      - 'services/**'
      - 'lib/assets/**'
      - 'small-business-ai/**'
      - 'ai-inbox-closer/**'
      - '404.html'
      - 'scripts/build-static-backup.mjs'
      - 'scripts/audit-public-routes.mjs'
      - 'package.json'
      - '.github/workflows/stellar-pages-static.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stellar-pages-static
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check routes and source
        run: npm run check:syntax && npm run audit:routes

      - name: Build static backup
        run: npm run build:static

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static backup artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
