name: Repository organisation audit
on:
  push:
    branches:
      - refactor/repo-organize-performance
    paths:
      - .github/workflows/repo-organize-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/repo-organize-performance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit structure and app payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          print('ROOT_ITEMS')
          for p in sorted(Path('.').iterdir(), key=lambda p:p.name.lower()):
              if p.name == '.git': continue
              print(('DIR ' if p.is_dir() else 'FILE ') + p.name)
          app = Path('app.html').read_text(encoding='utf-8')
          blocks = list(re.finditer(r'<style(?P<attrs>[^>]*)>(?P<body>[\s\S]*?)</style>', app, re.I))
          print(f'STYLE_BLOCK_COUNT={len(blocks)}')
          for i,m in enumerate(blocks):
              attrs=m.group('attrs').strip()
              body=m.group('body')
              print(f'STYLE_BLOCK_{i}_SIZE={len(body.encode("utf-8"))} ATTRS={attrs[:120]}')
          inline = re.findall(r'\sstyle=(?:"[^"]*"|\'[^\']*\')', app, re.I)
          print(f'INLINE_STYLE_ATTR_COUNT={len(inline)}')
          imgs = re.findall(r'<img\b[^>]*>', app, re.I)
          print(f'APP_IMG_COUNT={len(imgs)}')
          print(f'APP_IMG_WITH_LAZY={sum(1 for x in imgs if re.search(r"\bloading=[\"\']lazy[\"\']",x,re.I))}')
          blogs = sorted(Path('blog').glob('*.html'))
          print(f'BLOG_FILE_COUNT={len(blogs)}')
          vc = Path('vercel.json').read_text(encoding='utf-8')
          try:
              data=json.loads(vc)
              routes=[]
              for key in ('rewrites','redirects'):
                  for item in data.get(key,[]):
                      src=item.get('source','')
                      if src.startswith('/blog/'):
                          routes.append(src)
              print(f'VERCEL_BLOG_ROUTE_COUNT={len(routes)}')
          except Exception as e:
              print('VERCEL_JSON_PARSE_ERROR',e)
          print('PWA_FILES')
          for p in sorted(Path('lib/assets/pwa').glob('*')):
              print(p.as_posix())
          env=set()
          for p in list(Path('api').glob('*.js'))+list(Path('lib').glob('*.js')):
              text=p.read_text(encoding='utf-8')
              env.update(re.findall(r'process\.env\.([A-Z0-9_]+)', text))
          print('ENV_NAMES=' + ','.join(sorted(env)))
          PY
