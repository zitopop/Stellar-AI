name: Patch safe UI cache keys

on:
  push:
    branches:
      - fix/cache-bust-safe-ui-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force safe Orbit and growth scripts to refetch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text()
          old_orbit = '/stellar-orbit.js?v=2'
          old_growth = '/stellar-growth-v1.js?v=1'
          assert old_orbit in s, 'old Orbit script ref not found'
          assert old_growth in s, 'old growth script ref not found'
          s = s.replace(old_orbit, '/stellar-orbit.js?v=4-stability', 1)
          s = s.replace(old_growth, '/stellar-growth-v1.js?v=disabled-stability', 1)
          p.write_text(s)
          PY
          git rm .github/workflows/patch-ui-cache-bust.yml
          git config user.name "Stellar Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.html
          git commit -m "Force safe UI scripts to bypass stale service-worker cache"
          git push
