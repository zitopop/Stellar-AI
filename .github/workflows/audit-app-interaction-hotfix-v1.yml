name: Audit live app interaction hotfix

on:
  push:
    branches:
      - audit/app-interaction-hotfix-v1

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify live app remains interactive
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const hardTimeout = (promise, ms, label) => Promise.race([
            promise,
            sleep(ms).then(() => { throw new Error(`TIMEOUT at ${label} after ${ms}ms`); })
          ]);
          let browser;
          async function run() {
            browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            page.setDefaultTimeout(3000);
            const pageErrors = [];
            page.on('pageerror', err => pageErrors.push(String(err)));
            page.on('console', msg => { if (msg.type() === 'error') console.log('console-error:', msg.text()); });

            console.log('STAGE goto');
            await hardTimeout(page.goto('https://trystellarai.com/app', { waitUntil: 'domcontentloaded', timeout: 15000 }), 18000, 'goto');
            console.log('STAGE loaded');
            await page.waitForTimeout(1200);

            console.log('STAGE guest');
            const guest = page.getByRole('button', { name: 'Continue without signing in' });
            if (await hardTimeout(guest.isVisible().catch(() => false), 2500, 'guest-visible')) {
              await hardTimeout(guest.click({ timeout: 2500 }), 3000, 'guest-click');
              await page.waitForTimeout(250);
            }

            console.log('STAGE health');
            const health = await hardTimeout(page.evaluate(() => window.__stellarGrowthHealth || null), 3000, 'health-evaluate');
            console.log('growth-health:', JSON.stringify(health));
            if (!health || health.version !== 'safe-v2' || health.observers !== 0) throw new Error('Safe growth hotfix is not active: ' + JSON.stringify(health));

            console.log('STAGE timer');
            const responsiveness = await hardTimeout(page.evaluate(() => new Promise(resolve => {
              const start = performance.now();
              setTimeout(() => resolve(performance.now() - start), 60);
            })), 3000, 'main-thread-timer');
            console.log('timer-delay-ms:', responsiveness);
            if (responsiveness > 1000) throw new Error('Main thread appears blocked; 60ms timer took ' + responsiveness + 'ms');

            console.log('STAGE input');
            const input = page.locator('#txt');
            await hardTimeout(input.click(), 3000, 'input-click');
            await hardTimeout(input.fill('interaction check'), 3000, 'input-fill');
            if (await input.inputValue() !== 'interaction check') throw new Error('Prompt input is not interactive');
            await input.fill('');

            console.log('STAGE model');
            const modelButton = page.locator('#model-btn');
            await hardTimeout(modelButton.click(), 3000, 'model-button-click');
            await page.waitForTimeout(150);
            const panel = page.locator('.stellar-reasoning-panel');
            if (!(await hardTimeout(panel.isVisible().catch(() => false), 2500, 'reasoning-panel-visible'))) throw new Error('Reasoning picker did not open');
            await hardTimeout(page.locator('[data-growth-level="smart"]').click(), 3000, 'star-click');

            console.log('STAGE close-model');
            await page.keyboard.press('Escape').catch(() => {});
            await page.waitForTimeout(100);

            console.log('STAGE new-build');
            await hardTimeout(page.locator('#sidebar .side-new').click(), 3000, 'new-build-click');

            console.log('STAGE pointer');
            const bodyPointer = await hardTimeout(page.evaluate(() => getComputedStyle(document.body).pointerEvents), 3000, 'pointer-evaluate');
            console.log('body-pointer-events:', bodyPointer);
            if (bodyPointer === 'none') throw new Error('Body pointer-events is disabled');

            if (pageErrors.length) {
              console.log('page-errors:', pageErrors.join(' | '));
              const fatal = pageErrors.filter(e => /maximum call stack|out of memory|mutation|too much recursion/i.test(e));
              if (fatal.length) throw new Error('Fatal page errors: ' + fatal.join(' | '));
            }
            console.log('LIVE APP INTERACTION AUDIT PASSED');
          }

          hardTimeout(run(), 45000, 'whole-audit')
            .then(async () => { if (browser) await browser.close(); })
            .catch(async err => { console.error(err); if (browser) await browser.close().catch(() => {}); process.exit(1); });
          NODE
