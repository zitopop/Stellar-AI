name: Apply Stellar Orbit

on:
  push:
    branches:
      - ui/stellar-orbit-complete-v2
    paths:
      - '.github/workflows/apply-stellar-orbit.yml'
      - 'scripts/apply-stellar-orbit.mjs'
      - 'stellar-orbit.css'
      - 'stellar-orbit-extras.css'
      - 'stellar-orbit.js'
      - 'models.html'
      - 'tests/orbit-seo-contract.test.mjs'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/stellar-orbit-complete-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply UI and SEO patch
        run: node scripts/apply-stellar-orbit.mjs
      - name: Run focused regression tests
        run: node --test tests/orbit-seo-contract.test.mjs tests/mobile-density.test.mjs tests/workspace-accessibility.test.mjs tests/app-image-upload.test.mjs tests/dark-mode-contrast.test.mjs
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'stellar-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.html blog.html sitemap.xml robots.txt vercel.json index.html
          git commit -m 'Apply Stellar Orbit UI and SEO cleanup [orbit-applied]'
          git push origin HEAD:ui/stellar-orbit-complete-v2
