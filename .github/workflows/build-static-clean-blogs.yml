name: Build static clean Stellar blogs

on:
  push:
    branches:
      - fix/blog-static-clean-urls-v2

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[static-blogs-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/blog-static-clean-urls-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build 66 clean static pages
        run: |
          node scripts/build-static-clean-blogs.mjs
          node --check scripts/build-static-clean-blogs.mjs
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json valid')"
          test "$(find blog -maxdepth 1 -type f ! -name '*.html' | wc -l)" -ge 66
      - name: Commit generated pages
        run: |
          git config user.name 'stellar-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add blog vercel.json
          if git diff --cached --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git commit -m 'Serve all 66 blog URLs as real static files [static-blogs-built]'
          git push origin HEAD:fix/blog-static-clean-urls-v2
