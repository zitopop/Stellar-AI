name: Build clean HTML Stellar blogs

on:
  push:
    branches:
      - fix/blog-clean-html-files-v3

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[clean-html-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/blog-clean-html-files-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate all 66 clean HTML pages
        run: |
          node scripts/build-clean-html-blogs.mjs
          node --check scripts/build-clean-html-blogs.mjs
          node -e "const c=JSON.parse(require('fs').readFileSync('vercel.json','utf8')); if(c.cleanUrls!==true) process.exit(1); console.log('cleanUrls=true')"
          test "$(find blog -maxdepth 1 -type f -name '*.html' | wc -l)" -ge 66
      - name: Commit generated canonical pages
        run: |
          git config user.name 'stellar-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add blog vercel.json
          if git diff --cached --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git commit -m 'Match all 66 clean blog URLs to HTML files [clean-html-built]'
          git push origin HEAD:fix/blog-clean-html-files-v3
