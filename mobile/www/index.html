<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Stellar AI</title>
  <style>
    :root{color-scheme:dark;font-family:Manrope,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:#080808;color:#f7f5ff}
    body{display:grid;min-height:100dvh;place-items:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}
    main{width:min(100%,520px);text-align:center}.mark{display:grid;width:68px;height:68px;margin:0 auto 22px;place-items:center;border:1px solid #6f5bb6;border-radius:22px;background:radial-gradient(circle at 30% 20%,#f4d676,#35245f 58%,#15101f);box-shadow:0 20px 70px #5f40c755;font-size:30px}
    h1{margin:0;font-size:34px;letter-spacing:-.045em}p{margin:12px auto 0;color:#aaa3ba;line-height:1.65}
    .status{margin-top:22px;color:#cbbcff;font-size:13px;font-weight:800}.status::before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:#52e1b5;box-shadow:0 0 16px #52e1b5}
  </style>
  <link rel="stylesheet" href="/stellar-business-palette.css?v=1">
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>Stellar AI</h1>
    <p>The native shell could not reach the live workspace. Check your connection, then reopen the app.</p>
    <div class="status">Offline fallback ready</div>
  </main>
</body>
</html>
