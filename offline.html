<html lang="en">
<head>

  <link rel="apple-touch-icon" sizes="72x72" href="/lib/assets/pwa/icon-72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="/lib/assets/pwa/icon-76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="/lib/assets/pwa/icon-114.png">

  <title>Stellar AI — Offline</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif; background: #080808; color: #f4f4f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0%, #151515, #080808 58%); }
    main { width: min(100%, 430px); text-align: center; padding: 36px 24px calc(32px + env(safe-area-inset-bottom)); border: 1px solid rgba(255,255,255,.12); border-radius: 24px; background: rgba(20,20,22,.88); }
    .mark { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 20px; border: 1px solid rgba(112,214,193,.38); border-radius: 18px; color: #b8eee4; font-size: 25px; }
    h1 { margin: 0; font-size: 26px; letter-spacing: -.04em; }
    p { margin: 12px auto 24px; color: #a1a1aa; line-height: 1.55; font-size: 14px; }
    button { min-height: 46px; padding: 0 20px; border: 0; border-radius: 12px; background: linear-gradient(90deg,#b8eee4,#dfd4ff); color: #101414; font: 800 14px system-ui,sans-serif; cursor: pointer; }
  </style>
</head>
<body><main><div class="mark" aria-hidden="true">✦</div><h1>You’re offline</h1><p>Stellar AI is ready when your connection returns. Your installed app shell is still available.</p><button type="button" onclick="location.reload()">Try again</button></main></body>
</html>
