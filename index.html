<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    .chat-scroll { scrollbar-width: thin; scrollbar-color: #27272a #09090b; }
    .message { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .code-block { background: #111113; border: 1px solid #27272a; border-radius: 10px; }
    .typing-dot { animation: typingBounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-200">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-64 bg-[#09090b] border-r border-zinc-800 flex flex-col">
      <div class="p-4">
        <button onclick="newChat()" 
                class="w-full flex items-center justify-center gap-2 bg-white hover:bg-zinc-100 transition-colors text-zinc-950 py-2.5 rounded-2xl font-medium text-sm">
          <i class="fa-solid fa-plus text-sm"></i>
          <span>New chat</span>
        </button>
      </div>

      <!-- Chat History -->
      <div class="flex-1 overflow-y-auto px-2 chat-scroll" id="chat-list">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Main Area -->
    <div class="flex-1 flex flex-col">
      <!-- Top Bar -->
      <div class="h-14 border-b border-zinc-800 flex items-center px-5 justify-between bg-[#09090b]">
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 bg-white rounded-2xl flex items-center justify-center">
              <i class="fa-solid fa-robot text-zinc-950 text-xl"></i>
            </div>
            <div class="font-semibold text-lg tracking-tight">My AI</div>
          </div>

          <select id="model-select" onchange="changeModel()"
                  class="bg-zinc-900 border border-zinc-700 text-sm rounded-2xl px-3 py-1.5 focus:outline-none focus:border-zinc-600">
            <option value="smart">Smart</option>
            <option value="fast">Fast</option>
            <option value="ultra">Ultra</option>
          </select>
        </div>
      </div>

      <!-- Chat Messages -->
      <div id="chat" class="flex-1 overflow-y-auto p-6 chat-scroll bg-[#09090b]">
        <!-- Welcome -->
        <div id="welcome" class="h-full flex items-center justify-center">
          <div class="text-center max-w-md px-6">
            <div class="mx-auto w-14 h-14 bg-white rounded-3xl flex items-center justify-center mb-6">
              <i class="fa-solid fa-robot text-zinc-950 text-3xl"></i>
            </div>
            <h1 class="text-3xl font-semibold tracking-tight mb-3">How can I help you today?</h1>
            <p class="text-zinc-400 text-[15px]">Ask me anything. I can write code, debug, build games, or just chat.</p>
          </div>
        </div>
      </div>

      <!-- Input -->
      <div class="border-t border-zinc-800 p-4 bg-[#09090b]">
        <div class="max-w-3xl mx-auto">
          <div class="flex items-end gap-2 bg-zinc-900 border border-zinc-700 focus-within:border-zinc-600 transition-colors rounded-3xl p-2 shadow-inner">
            <button onclick="document.getElementById('file-input').click()" 
                    class="w-10 h-10 flex-shrink-0 flex items-center justify-center text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 rounded-2xl transition-colors">
              <i class="fa-solid fa-paperclip"></i>
            </button>
            
            <textarea id="input" rows="1" 
                      class="flex-1 bg-transparent resize-none outline-none px-3 py-2.5 text-[15px] placeholder:text-zinc-500 max-h-[180px]"
                      placeholder="Message My AI..."
                      onkeydown="if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
            
            <button onclick="sendMessage()" id="send-btn"
                    class="w-10 h-10 flex-shrink-0 flex items-center justify-center bg-white text-zinc-950 rounded-2xl hover:bg-zinc-100 active:scale-[0.985] transition-all">
              <i class="fa-solid fa-arrow-up"></i>
            </button>
          </div>
          <div class="text-center text-[10px] text-zinc-500 mt-2.5">My AI can make mistakes. Verify important information.</div>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" class="hidden" accept="image/*,.txt,.lua,.js,.py,.json,.md">

  <script>
    // ==================== CONFIG ====================
    const MODELS = {
      fast: { id: "claude-3-5-haiku-20241022", name: "Fast" },
      smart: { id: "claude-3-5-sonnet-20241022", name: "Smart" },
      ultra: { id: "claude-3-opus-20240229", name: "Ultra" }
    };

    let currentModel = "smart";
    let messages = [];
    let chats = JSON.parse(localStorage.getItem("myai_chats") || "[]");
    let currentChatId = null;

    // ==================== CHAT HISTORY ====================
    function saveChats() {
      localStorage.setItem("myai_chats", JSON.stringify(chats));
    }

    function renderChatList() {
      const container = document.getElementById("chat-list");
      container.innerHTML = "";

      if (chats.length === 0) {
        const empty = document.createElement("div");
        empty.className = "px-4 py-3 text-xs text-zinc-500";
        empty.textContent = "No chats yet";
        container.appendChild(empty);
        return;
      }

      chats.forEach(chat => {
        const div = document.createElement("div");
        div.className = `group flex items-center gap-2 px-3 py-[9px] mx-1 my-px rounded-2xl text-sm cursor-pointer hover:bg-zinc-800 transition-colors ${chat.id === currentChatId ? 'bg-zinc-800' : ''}`;
        
        div.innerHTML = `
          <div class="flex-1 truncate text-[13.5px]">${chat.title || "New chat"}</div>
          <button onclick="event.stopImmediatePropagation(); deleteChat('${chat.id}')" 
                  class="opacity-0 group-hover:opacity-100 text-zinc-500 hover:text-red-400 p-1 transition-all">
            <i class="fa-solid fa-trash text-xs"></i>
          </button>
        `;
        
        div.onclick = () => loadChat(chat.id);
        container.appendChild(div);
      });
    }

    function newChat() {
      currentChatId = Date.now().toString();
      messages = [];
      document.getElementById("chat").innerHTML = "";
      document.getElementById("welcome").style.display = "flex";
      renderChatList();
    }

    function loadChat(id) {
      const chat = chats.find(c => c.id === id);
      if (!chat) return;

      currentChatId = id;
      messages = chat.messages || [];
      
      const chatContainer = document.getElementById("chat");
      chatContainer.innerHTML = "";
      document.getElementById("welcome").style.display = "none";

      messages.forEach(msg => {
        if (msg.role === "user") {
          addUserMessage(msg.content, false);
        } else {
          addAIMessage(msg.content, false);
        }
      });
      renderChatList();
    }

    function deleteChat(id) {
      chats = chats.filter(c => c.id !== id);
      saveChats();
      renderChatList();
      if (currentChatId === id) newChat();
    }

    function saveCurrentChat() {
      if (!currentChatId || messages.length === 0) return;

      const title = messages[0]?.content?.slice(0, 45) || "New chat";
      const existing = chats.findIndex(c => c.id === currentChatId);

      const chatData = { id: currentChatId, title, messages, updated: Date.now() };

      if (existing !== -1) chats[existing] = chatData;
      else chats.unshift(chatData);

      saveChats();
      renderChatList();
    }

    // ==================== MESSAGES ====================
    function addUserMessage(text, save = true) {
      document.getElementById("welcome").style.display = "none";
      
      const div = document.createElement("div");
      div.className = "message flex justify-end mb-5";
      div.innerHTML = `
        <div class="max-w-[70%] bg-zinc-800 px-5 py-3 rounded-3xl text-[15px]">
          ${text}
        </div>
      `;
      document.getElementById("chat").appendChild(div);
      document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;

      if (save) {
        messages.push({ role: "user", content: text });
        saveCurrentChat();
      }
    }

    function addAIMessage(html, save = true) {
      const div = document.createElement("div");
      div.className = "message flex mb-5";
      div.innerHTML = `
        <div class="max-w-[82%]">
          <div class="prose prose-invert prose-sm text-[15px]">${html}</div>
        </div>
      `;
      document.getElementById("chat").appendChild(div);
      document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;

      if (save) {
        messages.push({ role: "assistant", content: html });
        saveCurrentChat();
      }
      return div;
    }

    // ==================== STREAMING + RENDER ====================
    async function sendMessage() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;

      addUserMessage(text);
      input.value = "";

      const aiDiv = document.createElement("div");
      aiDiv.className = "message flex mb-5";
      aiDiv.innerHTML = `
        <div class="max-w-[82%]">
          <div class="flex items-center gap-2 text-sm text-zinc-400 mb-1.5">
            <span>Thinking</span>
            <div class="flex gap-1"><span class="typing-dot w-1 h-1 bg-zinc-400 rounded-full"></span><span class="typing-dot w-1 h-1 bg-zinc-400 rounded-full"></span><span class="typing-dot w-1 h-1 bg-zinc-400 rounded-full"></span></div>
          </div>
          <div id="streaming-text" class="prose prose-invert text-[15px]"></div>
        </div>
      `;
      document.getElementById("chat").appendChild(aiDiv);
      const streamingText = aiDiv.querySelector("#streaming-text");

      let fullResponse = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: MODELS[currentModel].id,
            max_tokens: currentModel === "ultra" ? 4000 : 2000,
            system: "You are a helpful, concise, and direct AI assistant. Write clean, working code when asked. Be friendly but efficient.",
            messages: messages,
            stream: true
          })
        });

        if (!res.ok) throw new Error("Connection failed");

        const reader = res.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          chunk.split("\n").forEach(line => {
            if (line.startsWith("data: ")) {
              try {
                const data = JSON.parse(line.slice(6));
                if (data.delta?.text) {
                  fullResponse += data.delta.text;
                  streamingText.innerHTML = fullResponse.replace(/\n/g, "<br>");
                  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
                }
              } catch (e) {}
            }
          });
        }

        streamingText.innerHTML = renderMarkdown(fullResponse);
        messages.push({ role: "assistant", content: fullResponse });
        saveCurrentChat();

      } catch (err) {
        streamingText.innerHTML = `<span class="text-red-400">Error: ${err.message}. Please try again.</span>`;
      }
    }

    function renderMarkdown(text) {
      text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
        return `<div class="code-block my-3 p-4 text-xs font-mono overflow-x-auto"><div class="text-zinc-400 mb-2 text-[10px] uppercase tracking-wider">${lang || "code"}</div><pre class="whitespace-pre-wrap">${code.trim()}</pre></div>`;
      });
      return text.replace(/\n/g, "<br>");
    }

    function changeModel() {
      currentModel = document.getElementById("model-select").value;
    }

    // ==================== FILE UPLOAD ====================
    document.getElementById("file-input").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.type.startsWith("image/")) {
        addUserMessage("[Image attached]");
      } else {
        const reader = new FileReader();
        reader.onload = function(ev) {
          addUserMessage(`File: ${file.name}\n\n${ev.target.result.slice(0, 1800)}`);
        };
        reader.readAsText(file);
      }
      e.target.value = "";
    });

    // ==================== INIT ====================
    function init() {
      renderChatList();

      if (chats.length > 0) {
        loadChat(chats[0].id);
      } else {
        newChat();
      }

      // Keyboard focus
      document.addEventListener("keydown", function(e) {
        if ((e.metaKey || e.ctrlKey) && e.key === "/") {
          e.preventDefault();
          document.getElementById("input").focus();
        }
      });

      console.log("%c[My AI] Clean Grok-style version ready", "color:#3f3f46");
    }

    window.onload = init;
  </script>
</body>
</html>
