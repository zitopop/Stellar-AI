<style>
/* All original styles kept - only voice call CSS removed */
:root{
  --bg:#0a0716;
  --bg2:#15102d;
  --bg3:#1f1a3a;
  --text:#f5f5ff;
  --text2:#a0a0c0;
  --text3:#6a6a85;
  --accent:#7c8fff;
  --accent2:#a78bfa;
  --accent-glow:rgba(124,143,255,0.4);
  --border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.15);
  --code-bg:#0d1117;
  --code-head:#161b22;
  --code-border:#30363d;
  --code-text:#e6edf3;
  --green:#22c55e;
  --amber:#f59e0b;
  --red:#ef4444;
  --gold:#f5d76e;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px;
  --s5:20px; --s6:24px; --s7:32px; --s8:48px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-full:9999px;
  --sh-sm:0 1px 2px rgba(0,0,0,0.2);
  --sh-md:0 4px 12px rgba(0,0,0,0.3);
  --sh-lg:0 8px 32px rgba(0,0,0,0.4);
  --sh-glow:0 0 0 1px var(--accent-glow),0 4px 16px var(--accent-glow);
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --ease-smooth:cubic-bezier(0.25,0.1,0.25,1);
  --z-base:1;
  --z-content:5;
  --z-input:10;
  --z-sticky:20;
  --z-sidebar:80;
  --z-sidebar-scrim:79;
  --z-page:100;
  --z-codepanel:200;
  --z-popup:250;
  --z-modal-scrim:299;
  --z-modal:300;
  --z-toast:400;
}

/* (All theme, reset, stars, app shell, topbar, chat, input, sidebar, pages, code panel, etc. styles kept) */
body{
  font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text","Segoe UI",Roboto,sans-serif;
  background: radial-gradient(ellipse 90% 70% at 15% -10%, rgba(167,139,250,0.22), transparent 60%), radial-gradient(ellipse 80% 60% at 85% 110%, rgba(124,143,255,0.20), transparent 60%), var(--bg);
  color:var(--text);
  line-height:1.6;
  height:100vh;
  height:100dvh;
  width:100vw;
  overflow:hidden;
}

/* ... (the rest of your original styles are preserved) ... */

<body data-theme="purple">

<!-- Stars Canvas -->
<canvas id="stars"></canvas>

<div class="app" id="app">
  <div class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()" aria-label="Menu">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand" onclick="goHome()" style="cursor:pointer"><span class="bolt"><svg class="spark-ico"><use href="#spark"></use></svg></span>Stellar AI</div>
    <button class="model-chip" onclick="openModelPicker()">
      <span id="model-chip-name">Smart</span>
      <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </div>

  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-bolt"><svg class="spark-ico"><use href="#spark"></use></svg></div>
      <h1 class="welcome-greet">What can I help with?</h1>
      <p class="welcome-sub">Your AI for code, games & ideas</p>
    </div>
  </div>

  <!-- Input Area (mic button removed) -->
  <div class="input-area">
    <div class="input-row">
      <input type="file" id="code-input" accept=".lua,.txt,.js,.jsx,.ts,.json,.html,.css,.py,.md,.cs,.cpp,.c,.java,.xml,.yml,.yaml,.sql,.sh,.cfg,.ini,.log" style="position:absolute;left:-9999px;opacity:0" onchange="handleCodeFile(event)">
      <input type="file" id="img-input" accept="image/*" style="position:absolute;left:-9999px;opacity:0" onchange="handleImage(event)">
      
      <div class="input-row-top">
        <textarea id="txt" placeholder="Message Stellar AI..." rows="1" onkeydown="onKey(event)" oninput="growInput(this)"></textarea>
      </div>
      
      <div class="input-row-btm">
        <div class="input-btm-left">
          <button class="plus-btn" onclick="togglePlusMenu(event)">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <button id="send" onclick="onSendClick()">
          <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          <span class="stop-sq"></span>
        </button>
      </div>
    </div>
  </div>
</div>
