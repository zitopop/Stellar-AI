<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }
    .chat-scroll { scrollbar-width: thin; scrollbar-color: #27272a #09090b; }
    .message { animation: fadeIn 0.2s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .code-block { background: #111113; border: 1px solid #27272a; border-radius: 12px; }
    .chat-container { max-width: 820px; margin: 0 auto; }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-200">
  
  <!-- Top Bar -->
  <div class="h-14 border-b border-zinc-800 flex items-center px-4 justify-between bg-[#09090b]">
    <div class="flex items-center gap-3">
      <!-- Hamburger Menu -->
      <button onclick="toggleSidebar()" class="w-10 h-10 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-2xl transition-colors">
        <i class="fa-solid fa-bars text-xl"></i>
      </button>
      
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 bg-white rounded-2xl flex items-center justify-center">
          <i class="fa-solid fa-robot text-zinc-950 text-xl"></i>
        </div>
        <div class="font-semibold text-xl tracking-tight">My AI</div>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <select id="model-select" onchange="changeModel()" 
              class="bg-zinc-900 border border-zinc-700 text-sm rounded-2xl px-3 py-1.5 focus:outline-none">
        <option value="smart">Smart</option>
        <option value="fast">Fast</option>
        <option value="ultra">Ultra</option>
      </select>
      
      <button onclick="signInWithGoogle()" class="px-4 py-1.5 text-sm bg-zinc-800 hover:bg-zinc-700 rounded-2xl flex items-center gap-2">
        <i class="fa-brands fa-google"></i>
        <span class="text-xs">Sign in</span>
      </button>
    </div>
  </div>

  <!-- Main Chat Area -->
  <div class="flex-1 flex flex-col h-[calc(100vh-56px)]">
    <div id="chat" class="flex-1 overflow-y-auto p-6 chat-scroll">
      <!-- Welcome -->
      <div id="welcome" class="h-full flex items-center justify-center">
        <div class="text-center max-w-md">
          <div class="mx-auto w-14 h-14 bg-white rounded-3xl flex items-center justify-center mb-6">
            <i class="fa-solid fa-robot text-zinc-950 text-3xl"></i>
          </div>
          <h1 class="text-3xl font-semibold tracking-tight mb-3">How can I help you today?</h1>
          <p class="text-zinc-400">Sign in to sync your chats across all devices.</p>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="border-t border-zinc-800 p-4 bg-[#09090b]">
      <div class="max-w-[820px] mx-auto">
        <div class="flex items-end gap-2 bg-zinc-900 border border-zinc-700 focus-within:border-zinc-500 transition-colors rounded-3xl p-2">
          <button onclick="document.getElementById('file-input').click()" 
                  class="w-11 h-11 flex items-center justify-center text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 rounded-2xl transition-colors">
            <i class="fa-solid fa-paperclip"></i>
          </button>
          
          <textarea id="input" rows="1" 
                    class="flex-1 bg-transparent resize-none outline-none px-4 py-3 text-[15px] placeholder:text-zinc-500 max-h-[160px]"
                    placeholder="Message My AI..."
                    onkeydown="handleKeyDown(event)"></textarea>
          
          <button onclick="sendMessage()" id="send-btn"
                  class="w-11 h-11 flex items-center justify-center bg-white text-zinc-950 rounded-2xl hover:bg-zinc-100 active:scale-[0.95] transition-all">
            <i class="fa-solid fa-arrow-up"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Collapsible Sidebar (Chat History) -->
  <div id="sidebar" onclick="if (event.target.id === 'sidebar') closeSidebar()"
       class="hidden fixed inset-0 bg-black/60 z-50">
    <div onclick="event.stopImmediatePropagation()" 
         class="w-72 bg-[#09090b] border-r border-zinc-800 h-full overflow-y-auto p-4">
      
      <div class="flex justify-between items-center mb-4 px-2">
        <div class="font-semibold">Chats</div>
        <button onclick="closeSidebar()" class="text-zinc-400 hover:text-white">
          <i class="fa-solid fa-times text-xl"></i>
        </button>
      </div>

      <button onclick="newChat(); closeSidebar()" 
              class="w-full flex items-center justify-center gap-2 bg-white hover:bg-zinc-100 text-zinc-950 py-2.5 rounded-2xl font-medium text-sm mb-4">
        <i class="fa-solid fa-plus"></i>
        <span>New chat</span>
      </button>

      <div id="chat-list"></div>
    </div>
  </div>

  <input type="file" id="file-input" class="hidden">

  <script>
    // ==================== SUPABASE (for sync across devices) ====================
    const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";      // ← Change this
    const SUPABASE_ANON_KEY = "YOUR-ANON-KEY-HERE";               // ← Change this

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentModel = "smart";
    let messages = [];
    let chats = [];
    let currentChatId = null;

    // ==================== AUTH & SYNC ====================
    async function signInWithGoogle() {
      await supabase.auth.signInWithOAuth({ provider: 'google' });
    }

    async function checkUser() {
      const { data: { user } } = await supabase.auth.getUser();
      currentUser = user;
      if (user) await loadChatsFromCloud();
      else chats = JSON.parse(localStorage.getItem("myai_chats") || "[]");
      renderChatList();
    }

    async function loadChatsFromCloud() {
      if (!currentUser) return;
      const { data } = await supabase.from('chats').select('*').eq('user_id', currentUser.id).order('updated_at', { ascending: false });
      if (data) chats = data;
    }

    async function saveChatToCloud(chatData) {
      if (!currentUser) {
        localStorage.setItem("myai_chats", JSON.stringify(chats));
        return;
      }
      await supabase.from('chats').upsert({ ...chatData, user_id: currentUser.id });
    }

    // ==================== UI FUNCTIONS ====================
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("hidden");
    }
    function closeSidebar() {
      document.getElementById("sidebar").classList.add("hidden");
    }

    function renderChatList() {
      const container = document.getElementById("chat-list");
      container.innerHTML = "";

      chats.forEach((chat, index) => {
        const div = document.createElement("div");
        div.className = `px-3 py-2.5 rounded-2xl text-sm cursor-pointer hover:bg-zinc-800 flex justify-between items-center mb-1 ${chat.id === currentChatId ? 'bg-zinc-800' : ''}`;
        div.innerHTML = `
          <div class="truncate flex-1">${chat.title || "New chat"}</div>
          <button onclick="event.stopImmediatePropagation(); deleteChat('${chat.id}', ${index})" class="text-zinc-500 hover:text-red-400 p-1">
            <i class="fa-solid fa-trash text-xs"></i>
          </button>
        `;
        div.onclick = () => { loadChat(chat.id); closeSidebar(); };
        container.appendChild(div);
      });
    }

    function newChat() {
      currentChatId = Date.now().toString();
      messages = [];
      document.getElementById("chat").innerHTML = "";
      document.getElementById("welcome").style.display = "flex";
      closeSidebar();
    }

    function loadChat(id) {
      const chat = chats.find(c => c.id === id);
      if (!chat) return;
      currentChatId = id;
      messages = chat.messages || [];
      const chatContainer = document.getElementById("chat");
      chatContainer.innerHTML = "";
      document.getElementById("welcome").style.display = "none";
      messages.forEach(msg => {
        if (msg.role === "user") addUserMessage(msg.content, false);
        else addAIMessage(msg.content, false);
      });
      closeSidebar();
    }

    async function deleteChat(id, index) {
      if (!confirm("Delete this chat?")) return;
      chats.splice(index, 1);
      if (currentUser) await supabase.from('chats').delete().eq('id', id);
      else localStorage.setItem("myai_chats", JSON.stringify(chats));
      renderChatList();
      if (currentChatId === id) newChat();
    }

    async function saveCurrentChat() {
      if (!currentChatId || messages.length === 0) return;
      const title = messages[0]?.content?.slice(0, 50) || "New chat";
      const chatData = { id: currentChatId, title, messages };
      const existing = chats.findIndex(c => c.id === currentChatId);
      if (existing !== -1) chats[existing] = chatData;
      else chats.unshift(chatData);
      await saveChatToCloud(chatData);
      renderChatList();
    }

    // ==================== MESSAGING ====================
    function addUserMessage(text, save = true) {
      document.getElementById("welcome").style.display = "none";
      const div = document.createElement("div");
      div.className = "message max-w-[820px] mx-auto flex justify-end mb-4";
      div.innerHTML = `<div class="max-w-[75%] bg-zinc-800 px-5 py-3.5 rounded-3xl text-[15px]">${text}</div>`;
      document.getElementById("chat").appendChild(div);
      document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
      if (save) { messages.push({ role: "user", content: text }); saveCurrentChat(); }
    }

    function addAIMessage(html, save = true) {
      const div = document.createElement("div");
      div.className = "message max-w-[820px] mx-auto flex mb-4";
      div.innerHTML = `<div class="max-w-[82%] prose prose-invert text-[15px]">${html}</div>`;
      document.getElementById("chat").appendChild(div);
      document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
      if (save) { messages.push({ role: "assistant", content: html }); saveCurrentChat(); }
    }

    async function sendMessage() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;

      addUserMessage(text);
      input.value = "";

      const thinkingDiv = document.createElement("div");
      thinkingDiv.className = "max-w-[820px] mx-auto flex mb-4";
      thinkingDiv.innerHTML = `
        <div>
          <div class="flex items-center gap-2 text-sm text-zinc-400 mb-1">
            <span>Thinking</span>
            <div class="flex gap-1"><span class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce"></span><span class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce" style="animation-delay:0.15s"></span><span class="w-1.5 h-1.5 bg-zinc-400 rounded-full animate-bounce" style="animation-delay:0.3s"></span></div>
          </div>
          <div id="streaming-text" class="prose prose-invert text-[15px]"></div>
        </div>`;
      document.getElementById("chat").appendChild(thinkingDiv);
      const streamingText = thinkingDiv.querySelector("#streaming-text");

      let fullResponse = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: MODELS[currentModel].id,
            max_tokens: currentModel === "ultra" ? 4000 : 2000,
            system: "You are a helpful, concise AI assistant.",
            messages: messages,
            stream: true
          })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          chunk.split("\n").forEach(line => {
            if (line.startsWith("data: ")) {
              try {
                const data = JSON.parse(line.slice(6));
                if (data.delta?.text) {
                  fullResponse += data.delta.text;
                  streamingText.innerHTML = fullResponse.replace(/\n/g, "<br>");
                  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
                }
              } catch (e) {}
            }
          });
        }
        streamingText.innerHTML = fullResponse.replace(/```(\w*)\n?([\s\S]*?)```/g, `<div class="code-block my-3 p-4 text-xs font-mono"><pre>$2</pre></div>`);
        messages.push({ role: "assistant", content: fullResponse });
        await saveCurrentChat();
      } catch (err) {
        streamingText.innerHTML = `<span class="text-red-400">Error: ${err.message}</span>`;
      }
    }

    function handleKeyDown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    const MODELS = {
      fast: { id: "claude-3-5-haiku-20241022" },
      smart: { id: "claude-3-5-sonnet-20241022" },
      ultra: { id: "claude-3-opus-20240229" }
    };

    function changeModel() {
      currentModel = document.getElementById("model-select").value;
    }

    // ==================== INIT ====================
    async function init() {
      await checkUser();
      if (chats.length > 0) {
        loadChat(chats[0].id);
      } else {
        newChat();
      }
      console.log("%c[My AI] ChatGPT-style version ready with cloud sync", "color:#52525b");
    }

    window.onload = init;
  </script>
</body>
</html>
