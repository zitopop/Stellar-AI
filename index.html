<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .chat-container { scrollbar-width: thin; scrollbar-color: #374151 #111827; }
    .message { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .code-block { background: #0f172a; border-radius: 8px; }
    .typing { display: inline-flex; gap: 4px; }
    .typing span { width: 6px; height: 6px; background: #64748b; border-radius: 50%; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col">
      <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-white rounded-xl flex items-center justify-center">
            <i class="fa-solid fa-robot text-zinc-950 text-2xl"></i>
          </div>
          <div>
            <div class="font-semibold text-lg">My AI</div>
            <div class="text-[10px] text-zinc-500 -mt-1">Powered by Claude</div>
          </div>
        </div>
      </div>

      <div class="p-3">
        <button onclick="newChat()" 
                class="w-full flex items-center justify-center gap-2 bg-white text-zinc-950 hover:bg-zinc-100 transition-colors py-2.5 rounded-2xl font-medium text-sm">
          <i class="fa-solid fa-plus"></i>
          <span>New chat</span>
        </button>
      </div>

      <!-- Chat History -->
      <div class="flex-1 overflow-y-auto px-2 py-1" id="chat-list">
        <!-- Populated by JS -->
      </div>

      <div class="p-3 border-t border-zinc-800 text-xs text-zinc-500">
        <div class="flex items-center gap-2 px-2">
          <i class="fa-solid fa-key text-emerald-400"></i>
          <span>Using your Claude key</span>
        </div>
      </div>
    </div>

    <!-- Main Chat -->
    <div class="flex-1 flex flex-col">
      <!-- Top Bar -->
      <div class="h-14 border-b border-zinc-800 flex items-center px-4 justify-between bg-zinc-950">
        <div class="flex items-center gap-3">
          <select id="model-select" onchange="changeModel()"
                  class="bg-zinc-900 border border-zinc-700 text-sm rounded-xl px-3 py-1.5 focus:outline-none">
            <option value="smart">Smart (Recommended)</option>
            <option value="fast">Fast</option>
            <option value="ultra">Ultra (Most powerful)</option>
          </select>
        </div>
        
        <div class="flex items-center gap-2 text-sm text-zinc-400">
          <div class="px-3 py-1 bg-zinc-900 rounded-full text-xs flex items-center gap-1.5">
            <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
            <span>Connected</span>
          </div>
        </div>
      </div>

      <!-- Chat Messages -->
      <div id="chat" class="flex-1 overflow-y-auto p-6 chat-container bg-zinc-950">
        <!-- Welcome screen -->
        <div id="welcome" class="h-full flex items-center justify-center">
          <div class="text-center max-w-md">
            <div class="mx-auto w-16 h-16 bg-white rounded-3xl flex items-center justify-center mb-6">
              <i class="fa-solid fa-robot text-zinc-950 text-4xl"></i>
            </div>
            <h1 class="text-3xl font-semibold mb-2">How can I help you today?</h1>
            <p class="text-zinc-400">Ask anything. I can write code, debug, build games, or just chat.</p>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="border-t border-zinc-800 p-4 bg-zinc-950">
        <div class="max-w-3xl mx-auto">
          <div class="flex items-end gap-2 bg-zinc-900 border border-zinc-700 rounded-3xl p-2">
            <button onclick="document.getElementById('file-input').click()" 
                    class="w-10 h-10 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-2xl transition-colors">
              <i class="fa-solid fa-paperclip"></i>
            </button>
            
            <textarea id="input" rows="1" 
                      class="flex-1 bg-transparent resize-none outline-none px-2 py-2 text-sm max-h-40"
                      placeholder="Message My AI..."
                      onkeydown="if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
            
            <button onclick="sendMessage()" id="send-btn"
                    class="w-10 h-10 flex items-center justify-center bg-white text-zinc-950 rounded-2xl hover:bg-zinc-200 transition-colors">
              <i class="fa-solid fa-arrow-up"></i>
            </button>
          </div>
          <div class="text-center text-[10px] text-zinc-500 mt-2">My AI can make mistakes. Check important info.</div>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" class="hidden" accept="image/*,.txt,.lua,.js,.py,.json,.md">

  <script>
    // ==================== CONFIG ====================
    const MODELS = {
      fast: { id: "claude-3-5-haiku-20241022", name: "Fast" },
      smart: { id: "claude-3-5-sonnet-20241022", name: "Smart" },
      ultra: { id: "claude-3-opus-20240229", name: "Ultra" }
    };

    let currentModel = "smart";
    let messages = [];
    let chats = JSON.parse(localStorage.getItem("myai_chats") || "[]");
    let currentChatId = null;

    // ==================== TAILWIND ====================
    function initTailwind() {
      document.documentElement.style.setProperty('--accent', '#3b82f6');
    }

    // ==================== CHAT HISTORY ====================
    function saveChats() {
      localStorage.setItem("myai_chats", JSON.stringify(chats));
    }

    function renderChatList() {
      const container = document.getElementById("chat-list");
      container.innerHTML = "";

      if (chats.length === 0) {
        container.innerHTML = `<div class="px-3 py-2 text-xs text-zinc-500">No chats yet</div>`;
        return;
      }

      chats.forEach(chat => {
        const div = document.createElement("div");
        div.className = `px-3 py-2.5 mx-1 my-0.5 rounded-2xl text-sm cursor-pointer flex items-center gap-2 hover:bg-zinc-800 transition-colors ${chat.id === currentChatId ? 'bg-zinc-800' : ''}`;
        div.innerHTML = `
          <div class="flex-1 truncate">${chat.title || "New chat"}</div>
          <button onclick="event.stopImmediatePropagation(); deleteChat('${chat.id}')" class="text-zinc-500 hover:text-red-400 p-1">
            <i class="fa-solid fa-trash text-xs"></i>
          </button>
        `;
        div.onclick = () => loadChat(chat.id);
        container.appendChild(div);
      });
    }

    function newChat() {
      currentChatId = Date.now().toString();
      messages = [];
      document.getElementById("chat").innerHTML = "";
      document.getElementById("welcome").style.display = "flex";
      renderChatList();
    }

    function loadChat(id) {
      const chat = chats.find(c => c.id === id);
      if (!chat) return;

      currentChatId = id;
      messages = chat.messages || [];
      
      const chatContainer = document.getElementById("chat");
      chatContainer.innerHTML = "";
      document.getElementById("welcome").style.display = "none";

      messages.forEach(msg => {
        if (msg.role === "user") {
          addUserMessage(msg.content, false);
        } else {
          addAIMessage(msg.content, false);
        }
      });
      renderChatList();
    }

    function deleteChat(id) {
      chats = chats.filter(c => c.id !== id);
      saveChats();
      renderChatList();
      if (currentChatId === id) newChat();
    }

    function saveCurrentChat() {
      if (!currentChatId || messages.length === 0) return;

      const title = messages[0]?.content?.slice(0, 40) || "New chat";
      const existing = chats.findIndex(c => c.id === currentChatId);

      const chatData = {
        id: currentChatId,
        title: title,
        messages: messages,
        updated: Date.now()
      };

      if (existing !== -1) {
        chats[existing] = chatData;
      } else {
        chats.unshift(chatData);
      }
      saveChats();
      renderChatList();
    }

    // ==================== MESSAGES ====================
    function addUserMessage(text, save = true) {
      document.getElementById("welcome").style.display = "none";
      
      const div = document.createElement("div");
      div.className = "message flex justify-end mb-6";
      div.innerHTML = `
        <div class="max-w-[75%] bg-zinc-800 rounded-3xl px-5 py-3 text-sm">
          ${text}
        </div>
      `;
      document.getElementById("chat").appendChild(div);
      document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;

      if (save) {
        messages.push({ role: "user", content: text });
        saveCurrentChat();
      }
    }

    function addAIMessage(html, save = true) {
      const div = document.createElement("div");
      div.className = "message flex mb-6";
      div.innerHTML = `
        <div class="max-w-[80%]">
          <div class="prose prose-invert text-sm">${html}</div>
        </div>
      `;
      document.getElementById("chat").appendChild(div);
      document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;

      if (save) {
        messages.push({ role: "assistant", content: html });
        saveCurrentChat();
      }
      return div;
    }

    // ==================== STREAMING ====================
    async function sendMessage() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;

      addUserMessage(text);
      input.value = "";

      const aiDiv = document.createElement("div");
      aiDiv.className = "message flex mb-6";
      aiDiv.innerHTML = `
        <div class="max-w-[80%]">
          <div class="flex items-center gap-2 text-sm text-zinc-400 mb-1">
            <span>Thinking</span>
            <div class="typing"><span></span><span></span><span></span></div>
          </div>
          <div id="streaming-text" class="prose prose-invert text-sm"></div>
        </div>
      `;
      document.getElementById("chat").appendChild(aiDiv);
      const streamingText = aiDiv.querySelector("#streaming-text");

      let fullResponse = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: MODELS[currentModel].id,
            max_tokens: currentModel === "ultra" ? 4000 : 2000,
            system: "You are a helpful, concise AI assistant. Write clean, working code when asked. Be direct and friendly.",
            messages: messages,
            stream: true
          })
        });

        if (!res.ok) throw new Error("Failed to connect");

        const reader = res.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split("\n");

          for (const line of lines) {
            if (line.startsWith("data: ")) {
              try {
                const data = JSON.parse(line.slice(6));
                if (data.delta?.text) {
                  fullResponse += data.delta.text;
                  streamingText.innerHTML = fullResponse.replace(/\n/g, "<br>");
                  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
                }
              } catch (e) {}
            }
          }
        }

        // Final render with nice code blocks
        streamingText.innerHTML = renderMarkdown(fullResponse);
        messages.push({ role: "assistant", content: fullResponse });
        saveCurrentChat();

      } catch (err) {
        streamingText.innerHTML = `<span class="text-red-400">Error: ${err.message}</span>`;
      }
    }

    function renderMarkdown(text) {
      // Simple markdown + code block rendering
      text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
        return `<div class="code-block my-3 p-4 text-xs font-mono overflow-x-auto"><div class="text-zinc-400 mb-2 text-[10px]">${lang || "code"}</div>${code.trim()}</div>`;
      });
      return text.replace(/\n/g, "<br>");
    }

    function changeModel() {
      currentModel = document.getElementById("model-select").value;
    }

    // ==================== FILE UPLOAD ====================
    document.getElementById("file-input").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = function(ev) {
          addUserMessage(`[Image uploaded]`);
          // You can expand this later to actually send the image
        };
        reader.readAsDataURL(file);
      } else {
        const reader = new FileReader();
        reader.onload = function(ev) {
          addUserMessage(`File: ${file.name}\n\n${ev.target.result.slice(0, 2000)}`);
        };
        reader.readAsText(file);
      }
      e.target.value = "";
    });

    // ==================== INIT ====================
    function init() {
      initTailwind();
      renderChatList();

      // Load last chat if exists
      if (chats.length > 0) {
        loadChat(chats[0].id);
      } else {
        newChat();
      }

      // Keyboard shortcut
      document.addEventListener("keydown", function(e) {
        if (e.metaKey && e.key === "/") {
          e.preventDefault();
          document.getElementById("input").focus();
        }
      });

      console.log("%c[My AI] Clean version ready", "color:#64748b");
    }

    window.onload = init;
  </script>
</body>
</html>
