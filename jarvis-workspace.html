<script>
(() => {
  const $ = id => document.getElementById(id);
  const messages = [];
  function safeStorageGet(key,fallback=''){try{const value=localStorage.getItem(key);return value==null?fallback:value}catch{return fallback}}
  function safeStorageSet(key,value){try{localStorage.setItem(key,value);return true}catch{return false}}
  let busy = false, recognition = null, speaking = false, accessChecked = false, jarvisEntitled = false, micAvailable = false;
  let pendingController = null, speechRunId = 0;
  let jarvisSource = 'jarvis-public';
  let voiceOn = safeStorageGet('stellarJarvisVoiceReplies','1') !== '0';
  let handsFree = safeStorageGet('stellarJarvisHandsFree','0') === '1';

  function sessionToken(){
    try{return String(JSON.parse(safeStorageGet('stellar-store','{}')||'{}').session||'')}catch{return ''}
  }
  function headers(){const h={'Content-Type':'application/json'};const token=sessionToken();if(token)h.Authorization='Bearer '+token;return h}
  function setStatus(text,kind=''){const el=$('status');el.textContent=/^Ready[.]?$/.test(text)?'':text;el.className='status '+kind}
  function setBusy(value){busy=value;const blocked=!jarvisEntitled||!accessChecked;$('send').disabled=value||blocked;$('mic').disabled=value||blocked||!micAvailable;$('handsfree-toggle').disabled=blocked||!micAvailable;$('voice-toggle').disabled=blocked;$('prompt').disabled=blocked;$('new-chat').disabled=value;$('stop-response').hidden=!value}
  function addMessage(role,text){
    $('hero').hidden=true;
    const row=document.createElement('div');row.className='msg '+role;
    const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=role==='assistant'?'J':'You';
    const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;
    const content=document.createElement('div');content.className='message-content';
    const speaker=document.createElement('div');speaker.className='speaker';speaker.textContent=role==='assistant'?'Jarvis':'You';
    if(role==='assistant'){
      const copy=document.createElement('button');copy.type='button';copy.className='copy-response';copy.textContent='Copy response';copy.hidden=true;
      copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(bubble.textContent||'');copy.textContent='Copied ✓';setTimeout(()=>{copy.textContent='Copy response'},1800)}catch{setStatus('Copy unavailable. Select the answer and copy it manually.','bad')}});
      content.append(speaker,bubble,copy);
    }else content.append(speaker,bubble);
    row.append(avatar,content);$('messages').appendChild(row);row.scrollIntoView({block:'end',behavior:'smooth'});return bubble;
  }

  function appendFormattedInline(parent, value) {
    const source=String(value||'');
    const token=/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|\u0060([^\u0060\n]+)\u0060|\*\*([^*\n]+)\*\*|\*([^*\n]+)\*/g;
    let offset=0,match;
    while((match=token.exec(source))!==null){
      if(match.index>offset)parent.append(document.createTextNode(source.slice(offset,match.index)));
      let element;
      if(match[1]&&match[2]){
        try{
          const url=new URL(match[2]);
          if(url.protocol==='http:'||url.protocol==='https:'){
            element=document.createElement('a');
            element.href=url.href;
            element.target='_blank';
            element.rel='noopener noreferrer';
            element.textContent=match[1];
          }
        }catch{}
      }else if(match[3]){
        element=document.createElement('code');element.textContent=match[3];
      }else if(match[4]){
        element=document.createElement('strong');element.textContent=match[4];
      }else if(match[5]){
        element=document.createElement('em');element.textContent=match[5];
      }
      if(element)parent.append(element);
      else parent.append(document.createTextNode(match[0]));
      offset=token.lastIndex;
    }
    if(offset<source.length)parent.append(document.createTextNode(source.slice(offset)));
  }
  function renderFormattedReply(bubble, reply) {
    const lines=String(reply||'').replace(/\r\n?/g,'\n').split('\n');
    const fragment=document.createDocumentFragment();
    let paragraph=[],list=null;
    function endParagraph(){
      if(!paragraph.length)return;
      const p=document.createElement('p');
      appendFormattedInline(p,paragraph.join('\n'));
      fragment.append(p);
      paragraph=[];
    }
    function endList(){list=null}
    for(let i=0;i<lines.length;i++){
      const line=lines[i],trimmed=line.trim();
      const fence=trimmed.match(/^\x60{3}\s*([a-z0-9+#.-]*)\s*$/i);
      if(fence){
        endParagraph();endList();
        const codeLines=[];
        while(++i<lines.length&&!/^\s*\x60{3}\s*$/.test(lines[i]))codeLines.push(lines[i]);
        const pre=document.createElement('pre');
        const code=document.createElement('code');
        code.textContent=codeLines.join('\n');
        if(fence[1])code.dataset.language=fence[1].slice(0,24).toLowerCase();
        pre.append(code);
        fragment.append(pre);
        continue;
      }
      if(!trimmed){endParagraph();endList();continue}
      const heading=trimmed.match(/^(#{1,3})\s+(.+)$/);
      if(heading){
        endParagraph();endList();
        const h=document.createElement(heading[1].length===1?'h2':heading[1].length===2?'h3':'h4');
        appendFormattedInline(h,heading[2]);
        fragment.append(h);
        continue;
      }
      const quote=trimmed.match(/^>\s?(.*)$/);
      if(quote){
        endParagraph();endList();
        const q=document.createElement('blockquote');
        appendFormattedInline(q,quote[1]);
        fragment.append(q);
        continue;
      }
      const unordered=trimmed.match(/^[-*+]\s+(.+)$/),ordered=trimmed.match(/^\d+[.)]\s+(.+)$/);
      if(unordered||ordered){
        endParagraph();
        const kind=ordered?'ol':'ul';
        if(!list||list.tagName.toLowerCase()!==kind){list=document.createElement(kind);fragment.append(list)}
        const li=document.createElement('li');
        appendFormattedInline(li,(ordered||unordered)[1]);
        list.append(li);
        continue;
      }
      endList();
      paragraph.push(trimmed);
    }
    endParagraph();
    bubble.classList.add('rich-body');
    bubble.replaceChildren(fragment);
  }

  function cleanSpeech(text){return String(text||'').replace(/```[\s\S]*?```/g,'I have code ready for you on screen.').replace(/`([^`]+)`/g,'$1').replace(/https?:\/\/\S+/g,'a link').replace(/[•*_>#~]/g,' ').replace(/\s+/g,' ').trim()}
  function chooseVoice(){const list=speechSynthesis?.getVoices?.()||[];return list.find(v=>/^en-GB$/i.test(v.lang)&&/ryan|daniel|oliver|arthur|natural|premium|google|microsoft/i.test(v.name))||list.find(v=>/^en-GB$/i.test(v.lang))||list.find(v=>/^en/i.test(v.lang))||null}
  function stopSpeech(){speechRunId++;try{speechSynthesis?.cancel()}catch{};speaking=false;$('stop-voice').hidden=true;if(!busy)setStatus('Ready.')}
  function speak(text){
    if(!voiceOn||!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window))return;
    const clean=cleanSpeech(text).slice(0,1800);if(!clean)return;
    stopSpeech();const runId=++speechRunId;speaking=true;$('stop-voice').hidden=false;setStatus('Speaking…','good');
    const utterance=new SpeechSynthesisUtterance(clean);utterance.lang='en-GB';utterance.rate=.96;utterance.pitch=.90;utterance.volume=1;const v=chooseVoice();if(v)utterance.voice=v;
    utterance.onend=()=>{if(runId!==speechRunId)return;speaking=false;$('stop-voice').hidden=true;if(!busy)setStatus('Ready.');if(handsFree&&jarvisEntitled)setTimeout(()=>{if(runId===speechRunId)startListening()},320)};
    utterance.onerror=()=>{if(runId!==speechRunId)return;speaking=false;$('stop-voice').hidden=true;if(!busy)setStatus('Voice playback stopped.','bad')};
    speechSynthesis.speak(utterance);
  }
  function updateVoiceToggle(){const b=$('voice-toggle');b.setAttribute('aria-pressed',String(voiceOn));const label=voiceOn?'Turn voice replies off':'Turn voice replies on';b.setAttribute('aria-label',label);b.title=label;b.textContent=voiceOn?'🔊 Voice replies on':'🔇 Voice replies off'}
  function updateHandsFreeToggle(){const b=$('handsfree-toggle');b.setAttribute('aria-pressed',String(handsFree));b.textContent=handsFree?'Hands-free on':'Hands-free off'}
  function parseEvent(raw){
    try{const e=JSON.parse(raw);return e?.delta?.text||e?.text||e?.content_block?.text||e?.message?.content?.[0]?.text||(typeof e?.choices?.[0]?.delta?.content==='string'?e.choices[0].delta.content:'')||''}catch{return ''}
  }
  async function sendMessage(text){
    text=String(text||'').trim();if(!text||busy)return;
    if(!accessChecked){setStatus('Checking Jarvis access…','good');return}
    if(!jarvisEntitled){showAccess(sessionToken()?'Jarvis Voice is included with Plus and Pro.':'Sign in to use Jarvis Voice.',sessionToken()?'/plans':'/app?signin=1',sessionToken()?'See plans →':'Open sign in →');setStatus('Jarvis access is required.','bad');return}
    stopSpeech();const userBubble=addMessage('user',text);messages.push({role:'user',content:text});$('prompt').value='';resizePrompt();setBusy(true);setStatus('Thinking…','good');
    const bubble=addMessage('assistant','');bubble.classList.add('typing');let full='';
    const requestController=new AbortController();pendingController=requestController;
    try{
      const response=await fetch('/api/chat',{method:'POST',headers:headers(),body:JSON.stringify({action:'chat',model:'star',selectedModel:'star',messages:messages.slice(-24),use_credit:false,client:{source:jarvisSource}}),signal:requestController.signal});
      if(!response.ok){const data=await response.json().catch(()=>({}));if(response.status===401){$('signin').classList.add('show');throw new Error(data.error||'Sign in to use Jarvis.')}throw new Error(data.error||'Jarvis could not answer that request.')}
      if(!response.body)throw new Error('Jarvis returned no response.');
      const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';
      while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const chunks=buffer.split('\n');buffer=chunks.pop()||'';for(const line of chunks){if(!line.startsWith('data:'))continue;const raw=line.slice(5).trim();if(!raw||raw==='[DONE]')continue;const delta=parseEvent(raw);if(delta){full+=delta;bubble.classList.remove('typing');bubble.textContent=full;bubble.scrollIntoView({block:'end'})}}}
      if(buffer.startsWith('data:')){const raw=buffer.slice(5).trim();if(raw&&raw!=='[DONE]'){const delta=parseEvent(raw);if(delta)full+=delta}}
      if(!full.trim())full='I could not produce a response this time. Please try again.';bubble.classList.remove('typing');renderFormattedReply(bubble,full);bubble.parentElement?.querySelector('.copy-response')?.removeAttribute('hidden');messages.push({role:'assistant',content:full});setStatus('Ready.');speak(full);
    }catch(error){
      bubble.classList.remove('typing');
      if(requestController.signal.aborted){
        if(full.trim()){renderFormattedReply(bubble,full);bubble.parentElement?.querySelector('.copy-response')?.removeAttribute('hidden');messages.push({role:'assistant',content:full})}
        else bubble.parentElement?.parentElement?.remove();
        setStatus('Response stopped.');
      }else{
        // Failed requests must not lose a user's prompt or pollute the next conversation.
        if(!full.trim()){
          messages.pop();userBubble.closest('.msg')?.remove();bubble.closest('.msg')?.remove();
          if(!$('prompt').value.trim()){$('prompt').value=text;resizePrompt()}
        }else{renderFormattedReply(bubble,full);bubble.parentElement?.querySelector('.copy-response')?.removeAttribute('hidden');messages.push({role:'assistant',content:full})}
        setStatus((error.message||'Jarvis could not answer.')+' You can retry your message.','bad')
      }
    }
    finally{if(pendingController===requestController)pendingController=null;setBusy(false)}
  }
  function setupMic(){
    const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!Recognition){micAvailable=false;$('mic').disabled=true;$('handsfree-toggle').disabled=true;$('mic').textContent='Mic unavailable';$('handsfree-toggle').textContent='Hands-free unavailable';return}
    micAvailable=true;recognition=new Recognition();recognition.lang='en-GB';recognition.interimResults=true;recognition.continuous=false;
    let finalText='';
    recognition.onstart=()=>{finalText='';$('mic').classList.add('listening');$('mic').setAttribute('aria-pressed','true');$('mic').textContent='●';setStatus('Listening…','good')};
    recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0]?.transcript||'';if(e.results[i].isFinal)finalText+=t;else interim+=t}$('prompt').value=(finalText||interim).trim();resizePrompt()};
    let recognitionFailed=false;
    recognition.onerror=e=>{recognitionFailed=true;if(e.error==='not-allowed'){handsFree=false;safeStorageSet('stellarJarvisHandsFree','0');updateHandsFreeToggle();setStatus('Microphone permission was denied. Enable microphone access in your browser to talk to Jarvis.','bad')}else if(e.error==='no-speech')setStatus('I did not hear anything. Try again when you are ready.','bad');else setStatus('Voice input stopped. Try again or type your message.','bad')};
    recognition.onend=()=>{$('mic').classList.remove('listening');$('mic').setAttribute('aria-pressed','false');$('mic').textContent='🎙';const spoken=finalText.trim();finalText='';if(spoken)sendMessage(spoken);else if(!busy&&!recognitionFailed)setStatus('Ready.');recognitionFailed=false};
    $('mic').addEventListener('click',()=>{if(speaking)stopSpeech();startListening()});
  }
  function startListening(){if(!micAvailable||!recognition||busy||speaking||!jarvisEntitled)return;try{recognition.start()}catch{try{recognition.stop()}catch{}}}
  function showAccess(message,href,label){$('access-copy').textContent=message;$('access-link').href=href;$('access-link').textContent=label;$('signin').classList.add('show')}
  async function syncJarvisAccess(){
    accessChecked=false;jarvisEntitled=false;setBusy(false);
    const mode={textContent:'',classList:{add(){},remove(){}}};
    if(!sessionToken()){mode.textContent='Sign in required';$('retry-access').hidden=true;showAccess('Sign in to use Jarvis Voice.','/app?signin=1','Open sign in →');accessChecked=true;setBusy(false);return false}
    try{
      const r=await fetch('/api/get-plan',{headers:{Authorization:'Bearer '+sessionToken()},cache:'no-store'});const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||'Could not verify Jarvis access.');
      const caps=d?.capabilities?.jarvis||d?.accountPlan?.capabilities?.jarvis||{};
      const owner=d?.owner===true||d?.accountPlan?.owner===true;
      if(owner){jarvisSource='jarvis-owner';jarvisEntitled=true;mode.textContent='Jarvis enabled'}
      else if(caps.voice===true||caps.enabled===true){jarvisSource='jarvis-public';jarvisEntitled=true;mode.textContent='Jarvis voice';mode.classList.remove('owner')}
      else{mode.textContent='Plus or Pro';showAccess('Jarvis Voice is included with Plus and Pro.','/plans','See plans →')}
    }catch(error){mode.textContent='Access unavailable';showAccess(error.message||'Jarvis access could not be verified.','/app','Back to Stellar →');$('retry-access').hidden=false}
    accessChecked=true;setBusy(false);
    if(jarvisEntitled){$('retry-access').hidden=true;$('signin').classList.remove('show')}
    return jarvisEntitled;
  }
  function resizePrompt(){const el=$('prompt');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,168)+'px'}
  function newChat(){if(busy)return;stopSpeech();messages.splice(0);$('messages').replaceChildren();$('hero').hidden=false;$('prompt').value='';resizePrompt();setStatus('Ready.');if(jarvisEntitled)$('prompt').focus()}
  const voiceMenuButton=$('voice-settings'),voicePanel=$('voice-panel');
function closeVoicePanel(){voicePanel.hidden=true;voiceMenuButton.setAttribute('aria-expanded','false')}
voiceMenuButton.addEventListener('click',()=>{voicePanel.hidden=!voicePanel.hidden;voiceMenuButton.setAttribute('aria-expanded',String(!voicePanel.hidden))});
document.addEventListener('pointerdown',event=>{if(!voicePanel.hidden&&!voicePanel.contains(event.target)&&!voiceMenuButton.contains(event.target))closeVoicePanel()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!voicePanel.hidden){closeVoicePanel();voiceMenuButton.focus()}});
$('new-chat').addEventListener('click',()=>{closeVoicePanel();newChat()});
$('retry-access').addEventListener('click',()=>syncJarvisAccess());
  $('prompt').addEventListener('input',resizePrompt);
  $('composer').addEventListener('submit',e=>{e.preventDefault();sendMessage($('prompt').value)});
  $('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();sendMessage($('prompt').value)}});
  $('voice-toggle').addEventListener('click',()=>{voiceOn=!voiceOn;safeStorageSet('stellarJarvisVoiceReplies',voiceOn?'1':'0');if(!voiceOn){handsFree=false;safeStorageSet('stellarJarvisHandsFree','0');updateHandsFreeToggle();stopSpeech()}updateVoiceToggle()});
  $('handsfree-toggle').addEventListener('click',()=>{if(!jarvisEntitled)return;handsFree=!handsFree;voiceOn=handsFree?true:voiceOn;safeStorageSet('stellarJarvisHandsFree',handsFree?'1':'0');safeStorageSet('stellarJarvisVoiceReplies',voiceOn?'1':'0');updateVoiceToggle();updateHandsFreeToggle();if(handsFree&&!busy&&!speaking)startListening()});
  $('stop-voice').addEventListener('click',stopSpeech);
  $('stop-response').addEventListener('click',()=>{if(pendingController&&!pendingController.signal.aborted){pendingController.abort();setStatus('Stopping response…')}});
  updateVoiceToggle();updateHandsFreeToggle();setupMic();resizePrompt();syncJarvisAccess();
})();
</script>
