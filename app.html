async function refreshJarvisBriefingsPanel(){
  if(!isOwner())return;
  const preview=$('jarvis-briefing-preview'),state=$('jarvis-auto-state'),cooldown=$('jarvis-cooldown');
  try{
    const [snapshot,policy]=await Promise.all([
      ownerRequest('/api/broadcast',{action:'jarvisBriefing',call:false}),
      ownerRequest('/api/broadcast',{action:'getCallPolicy'})
    ]);
    jarvisCallPolicy={enabled:policy?.enabled!==false,cooldownMinutes:Number(policy?.cooldownMinutes)||15,categories:Array.isArray(policy?.categories)?policy.categories:[]};
    if(preview)preview.textContent=snapshot?.briefing||'Jarvis briefing is ready.';
    if(state)state.textContent=jarvisCallPolicy.enabled?'On':'Off';
    if(cooldown)cooldown.value=String(jarvisCallPolicy.cooldownMinutes);
    const health=$('owner-call-health-label');
    if(health)health.textContent=snapshot?.health?.ready?'Phone service ready via '+String(snapshot.health.provider||'provider'):'Phone service needs attention';
  }catch(error){
    if(preview)preview.textContent=error?.message||'Could not load the Jarvis briefing.';
    if(state)state.textContent='Unavailable';
  }
}
async function callJarvisBriefing(){
  if(!isOwner())return false;
  setStatus('Jarvis is preparing your briefing…','warn');
  try{
    const data=await ownerRequest('/api/broadcast',{action:'jarvisBriefing',call:true});
    const preview=$('jarvis-briefing-preview');if(preview&&data?.briefing)preview.textContent=data.briefing;
    setStatus(data?.phone_blocked?'Phone provider blocked · Jarvis in-app call started':'Jarvis briefing call started','good');
    return true;
  }catch(error){setStatus(error?.message||'Jarvis briefing could not start','error');return false}
}

function applyJarvisEntry(){const q=new URLSearchParams(location.search);if(String(q.get('jarvis')||'').toLowerCase()!=='voice')return false;q.delete('jarvis');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q.toString():'')+location.hash);setStatus('Voice mode ready. Press Voice and speak your message.','good');voiceButton?.focus();return true}
function pendingUpgrade(v=''){const q=new URLSearchParams(location.search),p=String(v||q.get('upgrade')||sessionStorage.getItem('stellar-pending-upgrade')||'').toLowerCase();if(!UPGRADE_PLANS.has(p))return '';sessionStorage.setItem('stellar-pending-upgrade',p);return p}function removeQuery(keys){const q=new URLSearchParams(location.search);keys.forEach(k=>q.delete(k));history.replaceState(null,'',location.pathname+(q.toString()?'?'+q.toString():'')+location.hash)}async function startPlanCheckout(plan){plan=String(plan||'').toLowerCase();metric('upgrade-intent');if(!UPGRADE_PLANS.has(plan)){setStatus('Plan unavailable','error');return}if(!token()){pendingUpgrade(plan);openPanel('settings');setStatus('Sign in first','warn');return}setStatus('Opening Stripe…','warn');metric('checkout-open');try{const res=await fetch('/api/create-checkout',{method:'POST',headers:authHeaders(),body:JSON.stringify({plan})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.url)throw new Error(data.error||'Checkout failed.');const u=new URL(data.url);if(u.protocol!=='https:'||u.hostname!=='checkout.stripe.com')throw new Error('Bad checkout link.');sessionStorage.removeItem('stellar-pending-upgrade');removeQuery(['upgrade']);location.assign(u.href)}catch(err){metric('checkout-error');setStatus(err.message||'Checkout failed','error')}}async function handlePendingIntents(){const p=pendingUpgrade();if(!token()){if(p)openPanel('settings');return}if(p)return startPlanCheckout(p)}
function selectModel(m){m=safeModel(m);if(!allowedModels.includes(m)){setStatus('Locked on this plan','warn');return}selectedModel=m;updateHeader();renderModelsPanel();setStatus(MODELS[m]+' selected','good')}function openPanel(kind){panelReturnFocus=document.activeElement instanceof HTMLElement?document.activeElement:null;closeSide();panelBackdrop.classList.add('open');if(kind==='plans'){metric('plans-panel-opened');renderPlansPanel()}else if(kind==='usage'){metric('usage-panel-opened');renderUsagePanel()}else if(kind==='models')renderModelsPanel();else if(kind==='search')renderSearchPanel();else if(kind==='tools')renderToolsPanel();else if(kind==='jarvis')renderJarvisBriefingsPanel();else renderSettingsPanel();setTimeout(()=>{const target=kind==='search'?$('chat-search-input'):$('closePanel');target?.focus()},0)}chatInner.addEventListener('click',async e=>{const button=e.target.closest('[data-message-action]');if(!button)return;if(button.dataset.messageAction==='copy')await copyAssistantResponse(button);else if(button.dataset.messageAction==='regenerate')await regenerateAssistantResponse(button)});$('export-chat-btn').addEventListener('click',exportCurrentChat);$('stellarx-btn').addEventListener('click',openComputerActionCard);window.addEventListener('offline',syncConnectivity);window.addEventListener('online',syncConnectivity);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('prompt')?.focus()}});panelBody.addEventListener('click',async e=>{const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action;if(a==='email-login')await emailAuth('login');else if(a==='email-signup')await emailAuth('signup');else if(a==='plan-checkout'){if(t.dataset.source==='usage')metric('upgrade-from-usage');await startPlanCheckout(t.dataset.plan);}else if(a==='open-chat-result'){const match=sessions.find(session=>session.id===t.dataset.chatId);if(match){activeId=match.id;renderAll();closePanel();prompt.focus()}}else if(a==='select-model')selectModel(t.dataset.model);else if(a==='open-settings')openPanel('settings');else if(a==='open-usage')openPanel('usage');else if(a==='open-plans')openPanel('plans');else if(a==='open-models')openPanel('models');else if(a==='open-jarvis-briefings')openPanel('jarvis');else if(a==='jarvis-briefing')await callJarvisBriefing();else if(a==='jarvis-preview')await refreshJarvisBriefingsPanel();else if(a==='jarvis-auto-toggle')await toggleJarvisAutoCalls();else if(a==='jarvis-policy-save')await saveJarvisCallPolicy();else if(a==='open-billing')await openBillingPortal();else if(a==='copy-referral')await copyReferralLink();else if(a==='share-referral')await shareReferralLink();else if(a==='export-chat')exportCurrentChat();else if(a==='launch-stellarx')launchComputerTask();else if(a==='call-owner')await triggerOwnerCall();else if(a==='call-health')await checkOwnerCallHealth();else if(a==='close-panel')closePanel();else if(a==='signout'){clearSession();signedInUser=null;await loadPlanTruth();loadSessions();closePanel();setStatus('Signed out','good')}});document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openPanel(el.dataset.open)));$('menuBtn').addEventListener('click',openSide);backdrop.addEventListener('click',closeSide);$('closePanel').addEventListener('click',closePanel);panelBackdrop.addEventListener('click',e=>{if(e.target===panelBackdrop)closePanel()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSide();closePanel()}});$('chatForm').addEventListener('submit',e=>{e.preventDefault();sendMessage(prompt.value)});sendBtn.addEventListener('click',e=>{if(!busy)return;e.preventDefault();currentGenerationController?.abort()});prompt.addEventListener('input',resizePrompt);prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(prompt.value)}});window.startPlanCheckout=startPlanCheckout;window.triggerOwnerCall=triggerOwnerCall;window.checkOwnerCallHealth=checkOwnerCallHealth;window.openBillingPortal=openBillingPortal;window.copyReferralLink=copyReferralLink;window.shareReferralLink=shareReferralLink;window.openComputerActionCard=openComputerActionCard;window.sendMessage=sendMessage;
async function init(){initImageInput();initVoiceInput();syncConnectivity();signedInUser=store().user||null;if(token())await refreshSession();await loadPlanTruth();await handlePaymentReturn();loadSessions();const q=new URLSearchParams(location.search);const prefill=q.get('prompt');if(prefill){prompt.value=prefill.slice(0,2000);resizePrompt();setStatus('Ready','good')}applyJarvisEntry();await handlePendingIntents();setStatus('Ready','good');prompt.focus()}init();
})();
