{border:1px solid rgba(255,255,255,.075);border-radius:16px;background:rgba(255,255,255,.025);padding:13px}.card strong,.plan strong,.row strong{display:block}.card small,.plan small,.row small{display:block;color:var(--muted);margin-top:3px}.plan.popular{border-color:rgba(155,140,255,.35);background:rgba(155,140,255,.08)}.inline-actions,.plan-actions,.settings-footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.inline-actions .btn,.settings-footer .btn,.plan-actions .btn{flex:1 1 145px}.field{display:grid;gap:6px;margin-top:10px}.field label{font-size:12px;font-weight:800;color:var(--soft)}.field input,.field select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:13px;background:#0d0f14;color:var(--text);padding:0 12px;outline:0}.field input:focus,.field select:focus{border-color:rgba(155,140,255,.5)}.google-box{display:grid;gap:9px;margin-bottom:10px;padding:13px;border:1px solid rgba(255,255,255,.085);border-radius:16px;background:rgba(255,255,255,.03)}.google-box small{color:#8f98a7}.google-render{min-height:42px;display:flex;align-items:center}.google-fallback{min-height:42px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:#fff;color:#111;font-weight:850;display:flex;align-items:center;justify-content:center;width:100%}.drawer-backdrop{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:30;inset:0 auto 0 0;width:min(300px,84vw);height:100dvh;transform:translateX(-105%);transition:transform .18s ease;box-shadow:18px 0 70px rgba(0,0,0,.42)}.side.open{transform:translateX(0)}.drawer-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.46);z-index:25;opacity:0;pointer-events:none}.drawer-backdrop.open{opacity:1;pointer-events:auto}.mobile-menu{display:inline-flex}.top-brand{display:none}.top{padding-inline:10px}.chat,.composer-wrap{padding-inline:10px}.model-chip{max-width:34vw}.model-chip .model-full{display:none}}@media(max-width:540px){.welcome{text-a <script id="stellar-google-signin-ui-v1">
(()=>{'use strict';
const $=id=>document.getElementById(id);const side=$('side'),backdrop=$('backdrop'),panelBackdrop=$('panelBackdrop'),panelTitle=$('panelTitle'),panelIntro=$('panelIntro'),panelBody=$('panelBody'),chatInner=$('chatInner'),chatList=$('chatList'),chatEmpty=$('chatEmpty'),prompt=$('prompt'),statusEl=$('status'),sendBtn=$('sendBtn'),creditCount=$('creditCount'),accountButton=$('accountButton'),modelLabel=$('modelLabel');
const GOOGLE_CLIENT_ID='308347075858-9eu0dootm325qgq7hba7qsnnchmcke1r.apps.googleusercontent.com';const STORE='stellar-store';const MODELS={spark:'Spark',star:'Star',comet:'Comet',nova:'Nova'};const COSTS={spark:2,star:5,comet:10,nova:20};const CREDIT_PACKS=new Map([[300,'£3 · 300 credits'],[500,'£5 · 525 credits'],[1000,'£10 · 1,100 credits'],[2500,'£25 · 2,875 credits'],[5000,'£50 · 6,000 credits'],[10000,'£100 · 12,000 credits'],[20000,'£200 · 24,000 credits']]);const UPGRADE_PLANS=new Set(['starter','plus','pro','starter-annual','plus-annual','pro-annual']);
let sessions=[],activeId='',busy=false,signedInUser=null,serverOwner=false,selectedModel=safeModel(localStorage.getItem('stellar-selected-model')||'star'),allowedModels=['spark','star'],planState={plan:'free',name:'Free',remaining:75,wallet:0,costs:{...COSTS}};
function safeModel(v){v=String(v||'').toLowerCase();return MODELS[v]?v:'star'}function uid(){return 'c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}function now(){return Date.now()}function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}function setStatus(t,k='good'){statusEl.textContent=String(t||'');statusEl.className='status '+k}function store(){try{const v=JSON.parse(localStorage.getItem(STORE)||'{}');return v&&typeof v==='object'?v:{}}catch{return {}}}function token(){const t=store().session;return typeof t==='string'?t:''}function setSession(session,user){const s=store();localStorage.setItem(STORE,JSON.stringify({...s,session:String(session||''),user:user||s.user||null,owner:false}))}function clearSession(){const s=store();localStorage.setItem(STORE,JSON.stringify({...s,session:'',user:null,owner:false}))}function authHeaders(json=true){const h=json?{'content-type':'application/json'}:{};const t=token();if(t)h.Authorization='Bearer '+t;return h}function closeSide(){side.classList.remove('open');backdrop.classList.remove('open')}function openSide(){side.classList.add('open');backdrop.classList.add('open')}function closePanel(){panelBackdrop.classList.remove('open')}function fmt(n){return Number.isFinite(n)?Math.round(n).toLocaleString('en-GB'):'∞'}function displayName(user){const email=String(user&&user.email||'').trim();const raw=String(user&&(user.name||user.given_name)||'').replace(/[._-]+/g,' ').trim();let name=raw.split(/\s+/)[0]||'';if(!name&&email)name=email.split('@')[0].replace(/[._-]+/g,' ');if(email.toLowerCase()==='deadlyfox10@gmail.com')return 'Tobi';return name?name.replace(/\b\w/g,c=>c.toUpperCase()):'there'}function totalCredits(){return serverOwner?Infinity:Math.max(0,Number(planState.remaining)||0)+Math.max(0,Number(planState.wallet)||0)}function accountKey(){return String(signedInUser&&signedInUser.email||'guest').toLowerCase()}function sessionsKey(){return 'stellar-chat-sessions:'+accountKey()}function defaultSession(){return{id:uid(),title:'New chat',messages:[],created:now(),updated:now()}}function sortSessions(){sessions.sort((a,b)=>(b.updated-a.updated))}function saveSessions(){sortSessions();localStorage.setItem(sessionsKey(),JSON.stringify(sessions.slice(0,50)))}function loadSessions(){try{sessions=JSON.parse(localStorage.getItem(sessionsKey())||'[]');if(!Array.isArray(sessions))sessions=[]}catch{sessions=[]}if(!sessions.length)sessions=[defaultSession()];activeId=sessions[0].id;saveSessions();renderAll()}function activeSession(){let s=sessions.find(x=>x.id===activeId);if(!s){s=sessions[0]||defaultSession();activeId=s.id;if(!sessions.includes(s))sessions.push(s)}return s}function titleFrom(text){const t=String(text||'').trim().replace(/\s+/g,' ');return t?t.slice(0,44):'New chat'}function chatAge(ts){const d=Math.max(0,now()-Number(ts||now()));if(d<60000)return 'now';if(d<3600000)return Math.floor(d/60000)+'m';if(d<86400000)return Math.floor(d/3600000)+'h';return Math.floor(d/86400000)+'d'}
function renderChatList(){sortSessions();chatList.innerHTML='';chatEmpty.classList.toggle('hidden',sessions.length>0);for(const s of sessions){const row=document.createElement('button');row.type='button';row.className='chat-item'+(s.id===activeId?' active':'');row.dataset.id=s.id;row.innerHTML='<span class="chat-title">'+escapeHtml(s.title||'New chat')+'</span><span class="chat-meta">'+escapeHtml(chatAge(s.updated))+'</span>';chatList.append(row)}}function welcomeHtml(){return '<div class="welcome"><h1>Hi '+escapeHtml(displayName(signedInUser))+'.</h1><p>Type below. Press ↑ to send.</p></div>'}function renderMessages(){const s=activeSession();chatInner.innerHTML='';if(!s.messages.length){chatInner.innerHTML=welcomeHtml();return}for(const m of s.messages)addMessage(m.role,m.content,false)}function renderAll(){renderChatList();renderMessages();updateHeader()}function addMessage(role,text,scroll=true){const wrap=document.createElement('article');wrap.className='msg '+role;wrap.innerHTML='<div class="meta">'+(role==='user'?'You':'Stellar')+'</div><div class="bubble"></div>';wrap.querySelector('.bubble').textContent=String(text||'');chatInner.append(wrap);if(scroll)wrap.scrollIntoView({block:'end'});return wrap.querySelector('.bubble')}function updateHeader(){const total=totalCredits();creditCount.textContent=Number.isFinite(total)?fmt(total):'∞';if(accountButton)accountButton.textContent=signedInUser?'Account':'Sign in';if(!allowedModels.includes(selectedModel))selectedModel=allowedModels.includes('star')?'star':(allowedModels[0]||'spark');localStorage.setItem('stellar-selected-model',selectedModel);const txt=MODELS[selectedModel]+' · '+(planState.costs[selectedModel]||COSTS[selectedModel])+' credits';if(modelLabel)modelLabel.textContent=txt}
chatList.addEventListener('click',e=>{const row=e.target.closest('.chat-item');if(!row)return;activeId=row.dataset.id;renderAll();closeSide()});function newChat(){const s=defaultSession();sessions.unshift(s);activeId=s.id;saveSessions();renderAll();closeSide();setStatus('Ready','good');prompt.focus()}$('newChatBtn').addEventListener('click',newChat);
function parseReply(raw){let out='';for(const line of String(raw||'').split(/\r?\n/)){if(!line.startsWith('data:'))continue;const payload=line.slice(5).trim();if(!payload||payload==='[DONE]')continue;try{const ev=JSON.parse(payload);out+=ev?.delta?.text||ev?.delta||ev?.text||ev?.content||ev?.choices?.[0]?.delta?.content||''}catch{}}if(out)return out;try{const p=JSON.parse(raw);return p.reply||p.text||p.message||raw}catch{return raw}}async function sendMessage(text){if(busy)return;const userText=String(text||'').trim();if(!userText){prompt.focus();setStatus('Type first','warn');return}busy=true;sendBtn.disabled=true;const s=activeSession();if(!s.messages.length)s.title=titleFrom(userText);s.messages.push({role:'user',content:userText});s.updated=now();saveSessions();renderAll();const reply=addMessage('assistant','Thinking…');prompt.value='';setStatus('Thinking…','warn');try{const res=await fetch('/api/chat',{method:'POST',headers:authHeaders(),body:JSON.stringify({action:'chat',model:selectedModel,selectedModel,use_credit:Boolean(token()),messages:s.messages.slice(-16),client:{source:'stellar-clean-chat-v1'}})});const raw=await res.text();if(!res.ok){let err=raw;try{const p=JSON.parse(raw);err=p.error?.message||p.error||raw}catch{}throw new Error(String(err||'Chat failed'))}const answer=parseReply(raw).trim()||'Done.';reply.textContent=answer;s.messages.push({role:'assistant',content:answer});s.updated=now();saveSessions();renderChatList();setStatus('Ready','good');if(token())loadPlanTruth()}catch(err){reply.textContent='Could not send. '+(err&&err.message||'Try again.');setStatus('Send failed','error')}finally{busy=false;sendBtn.disabled=false;prompt.focus()}}
function planCard(name,price,credits,detail,plan,popular=false){const yearly=plan?plan+'-annual':'';return '<div class="plan '+(popular?'popular':'')+'"><strong>'+name+(price?' · '+price:'')+'</strong><small>'+credits+' · '+detail+'</small>'+(plan?'<div class="plan-actions"><button class="btn primary" type="button" data-action="plan-checkout" data-plan="'+plan+'">Monthly</button><button class="btn ghost" type="button" data-action="plan-checkout" data-plan="'+yearly+'">Yearly</button></div>':'')+'</div>'}function renderPlansPanel(){panelTitle.textContent='Plans';panelIntro.textContent='Choose when you need more.';panelBody.innerHTML='<div class="plans-grid">'+planCard('Free','£0','75/day','try it','')+planCard('Starter','£8/mo','5,000/month','everyday','starter')+planCard('Plus','£20/mo','15,000/month','builders','plus',true)+planCard('Pro','£75/mo','50,000/month','heavy work','pro')+'</div>'}function renderCreditsPanel(){panelTitle.textContent='Credits';panelIntro.textContent='Top up only when needed.';if(!token()){panelBody.innerHTML='<div class="grid"><div class="card"><strong>Sign in first</strong><small>Credits attach to your account.</small></div><button class="btn primary" type="button" data-action="open-settings">Sign in</button></div>';return}if(serverOwner){panelBody.innerHTML='<div class="card"><strong>Owner</strong><small>Unlimited owner access.</small></div>';return}const opts=Array.from(CREDIT_PACKS.entries()).map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join('');panelBody.innerHTML='<div class="grid"><div class="card"><strong>'+escapeHtml(planState.name)+'</strong><small>'+fmt(planState.remaining)+' included credits.</small></div><div class="card"><strong>Wallet</strong><small>'+fmt(planState.wallet)+' bought credits.</small></div><div class="field"><label for="topupAmount">Top-up</label><select id="topupAmount">'+opts+'</select></div><button class="btn primary" type="button" data-action="credit-checkout">Continue to Stripe</button></div>'}function renderModelsPanel(){panelTitle.textContent='Models';panelIntro.textContent='Pick the strength.';const order=['spark','star','comet','nova'];panelBody.innerHTML='<div class="grid">'+order.map(key=>{const allowed=allowedModels.includes(key);return '<button class="row" type="button" data-action="select-model" data-model="'+key+'" '+(allowed?'':'disabled')+'><strong>'+MODELS[key]+(selectedModel===key?' · selected':'')+'</strong><small>'+(planState.costs[key]||COSTS[key])+' credits/message'+(allowed?'':' · locked')+'</small></button>'}).join('')+'</div>'}
function renderSettingsPanel(){panelTitle.textContent=signedInUser?'Account':'Sign in';panelIntro.textContent=signedInUser?'Plan, credits and billing.':'Use Google, email or Discord.';if(!signedInUser){panelBody.innerHTML='<div class="settings-sheet"><section class="google-box"><strong>Continue with Google</strong><small>Fastest way to sign in.</small><div class="google-render" id="googleRender"></div><button class="google-fallback" type="button" id="googleFallback">Continue with Google</button></section><section class="card"><div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="authPassword">Password</label><input id="authPassword" type="password" autocomplete="current-password" minlength="8" maxlength="100" placeholder="8+ characters"></div><div class="inline-actions"><button class="btn primary" type="button" data-action="email-login">Sign in</button><button class="btn ghost" type="button" data-action="email-signup">Create account</button></div><a class="btn ghost" style="margin-top:8px;width:100%" href="/api/discord-oauth">Discord</a></section></div>';renderGoogleButton();return}panelBody.innerHTML='<div class="settings-sheet"><section class="card"><strong>'+escapeHtml(displayName(signedInUser))+'</strong><small>'+escapeHtml(signedInUser.email||'Signed in')+'</small></section><section class="grid"><button class="row" type="button" data-action="open-credits"><strong>Credits</strong><small>'+fmt(totalCredits())+' available</small></button><button class="row" type="button" data-action="open-plans"><strong>Plans</strong><small>'+escapeHtml(planState.name)+'</small></button><button class="row" type="button" data-action="open-models"><strong>Model</strong><small>'+MODELS[selectedModel]+'</small></button></section><div class="settings-footer"><button class="btn danger" type="button" data-action="signout">Sign out</button><button class="btn ghost" type="button" data-action="close-panel">Done</button></div></div>'}
function renderGoogleButton(){const target=$('googleRender'),fallback=$('googleFallback');function onReady(){try{google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleGoogleCredential,auto_select:false,cancel_on_tap_outside:true});if(target)google.accounts.id.renderButton(target,{theme:'outline',size:'large',shape:'pill',text:'continue_with',width:Math.min(360,Math.max(240,(target.parentElement?.clientWidth||320)-28))});fallback?.addEventListener('click',()=>google.accounts.id.prompt())}catch{if(fallback)fallback.textContent='Google unavailable'}}if(window.google?.accounts?.id)onReady();else{let tries=0;const timer=setInterval(()=>{tries++;if(window.google?.accounts?.id){clearInterval(timer);onReady()}else if(tries>25){clearInterval(timer);if(fallback)fallback.textContent='Google unavailable'}},200)}}function referralCode(){try{const q=new URLSearchParams(location.search);return q.get('ref')||q.get('referral')||localStorage.getItem('stellar-referral-code')||''}catch{return ''}}async function handleGoogleCredential(response){if(!response?.credential){setStatus('Google cancelled','warn');return}setStatus('Signing in…','warn');try{const res=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'googleLogin',credential:response.credential,referralCode:referralCode()})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.session)throw new Error(data.error||'Google sign-in failed.');signedInUser=data.user||{};setSession(data.session,signedInUser);await loadPlanTruth();loadSessions();closePanel();setStatus('Signed in','good')}catch(err){setStatus(err.message||'Google failed','error')}}async function emailAuth(mode){const email=String($('authEmail')?.value||'').trim().toLowerCase(),password=String($('authPassword')?.value||'');if(!email.includes('@')){setStatus('Enter email','error');return}if(password.length<8){setStatus('Password 8+','error');return}setStatus(mode==='signup'?'Creating…':'Signing in…','warn');try{const res=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:mode,email,password,referralCode:referralCode()})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.session)throw new Error(data.error||'Sign-in failed.');signedInUser=data.user||{email};setSession(data.session,signedInUser);await loadPlanTruth();loadSessions();closePanel();setStatus('Signed in','good');await handlePendingIntents()}catch(err){setStatus(err.message||'Could not sign in','error')}}async function refreshSession(){if(!token())return false;try{const res=await fetch('/api/auth',{method:'POST',headers:authHeaders(),body:JSON.stringify({action:'refreshSession'})});const data=await res.json().catch(()=>({}));if(res.status===401){clearSession();signedInUser=null;return false}if(res.ok&&data.session){signedInUser=data.user||store().user||{email:data.email};setSession(data.session,signedInUser);return true}}catch{}return false}async function loadPlanTruth(){if(!token()){serverOwner=false;allowedModels=['spark','star'];planState={plan:'free',name:'Free',remaining:75,wallet:0,costs:{...COSTS}};updateHeader();return}try{const res=await fetch('/api/get-plan',{cache:'no-store',headers:authHeaders(false)});const data=await res.json().catch(()=>({}));if(res.status===401){clearSession();signedInUser=null;await loadPlanTruth();return}if(!res.ok)throw new Error(data.error||'Could not load plan.');const account=data.accountPlan||{},caps=data.capabilities||account.capabilities||{},usage=data.usage||account.usage||{};serverOwner=data.owner===true||account.owner===true;allowedModels=(Array.isArray(data.availableModels)?data.availableModels:Array.isArray(account.availableModels)?account.availableModels:Array.isArray(caps.models)?caps.models:['spark','star']).map(safeModel);planState={plan:String(data.plan||data.planId||account.id||'free').toLowerCase(),name:String(data.planName||data.planLabel||account.name||caps.name||'Free'),remaining:serverOwner?0:Math.max(0,Number(usage.remaining??caps.includedCredits??75)||0),wallet:serverOwner?0:Math.max(0,Number(data.addOnCredits??data.walletCredits??account.addOnCredits??0)||0),costs:caps.modelCreditCosts&&typeof caps.modelCreditCosts==='object'?caps.modelCreditCosts:{...COSTS}};updateHeader()}catch(err){setStatus(err.message||'Plan refresh failed','warn');updateHeader()}}
function pendingUpgrade(v=''){const q=new URLSearchParams(location.search),p=String(v||q.get('upgrade')||sessionStorage.getItem('stellar-pending-upgrade')||'').toLowerCase();if(!UPGRADE_PLANS.has(p))return '';sessionStorage.setItem('stellar-pending-upgrade',p);return p}function pendingCredit(v=0){const q=new URLSearchParams(location.search),a=Number(v||q.get('credits')||sessionStorage.getItem('stellar-pending-credit-pack')||0);if(!CREDIT_PACKS.has(a))return 0;sessionStorage.setItem('stellar-pending-credit-pack',String(a));return a}function removeQuery(keys){const q=new URLSearchParams(location.search);keys.forEach(k=>q.delete(k));history.replaceState(null,'',location.pathname+(q.toString()?'?'+q.toString():'')+location.hash)}async function startPlanCheckout(plan){plan=String(plan||'').toLowerCase();if(!UPGRADE_PLANS.has(plan)){setStatus('Plan unavailable','error');return}if(!token()){pendingUpgrade(plan);openPanel('settings');setStatus('Sign in first','warn');return}setStatus('Opening Stripe…','warn');try{const res=await fetch('/api/create-checkout',{method:'POST',headers:authHeaders(),body:JSON.stringify({plan})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.url)throw new Error(data.error||'Checkout failed.');const u=new URL(data.url);if(u.protocol!=='https:'||u.hostname!=='checkout.stripe.com')throw new Error('Bad checkout link.');sessionStorage.removeItem('stellar-pending-upgrade');removeQuery(['upgrade']);location.assign(u.href)}catch(err){setStatus(err.message||'Checkout failed','error')}}async function startCreditCheckout(amount){amount=Number(amount||$('topupAmount')?.value||0);if(!CREDIT_PACKS.has(amount)){setStatus('Choose a pack','error');return}if(!token()){pendingCredit(amount);openPanel('settings');setStatus('Sign in first','warn');return}setStatus('Opening Stripe…','warn');try{const res=await fetch('/api/create-checkout',{method:'POST',headers:authHeaders(),body:JSON.stringify({plan:'topup',amount})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.url)throw new Error(data.error||'Checkout failed.');const u=new URL(data.url);if(u.protocol!=='https:'||u.hostname!=='checkout.stripe.com')throw new Error('Bad checkout link.');sessionStorage.removeItem('stellar-pending-credit-pack');removeQuery(['credits']);location.assign(u.href)}catch(err){setStatus(err.message||'Checkout failed','error')}}async function handlePendingIntents(){const p=pendingUpgrade(),c=pendingCredit();if(!token()){if(p||c)openPanel('settings');return}if(p)return startPlanCheckout(p);if(c)return startCreditCheckout(c)}
function selectModel(m){m=safeModel(m);if(!allowedModels.includes(m)){setStatus('Locked on this plan','warn');return}selectedModel=m;updateHeader();renderModelsPanel();setStatus(MODELS[m]+' selected','good')}function openPanel(kind){closeSide();panelBackdrop.classList.add('open');if(kind==='plans')renderPlansPanel();else if(kind==='credits')renderCreditsPanel();else if(kind==='models')renderModelsPanel();else renderSettingsPanel()}panelBody.addEventListener('click',async e=>{const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action;if(a==='email-login')await emailAuth('login');else if(a==='email-signup')await emailAuth('signup');else if(a==='plan-checkout')await startPlanCheckout(t.dataset.plan);else if(a==='credit-checkout')await startCreditCheckout();else if(a==='select-model')selectModel(t.dataset.model);else if(a==='open-settings')openPanel('settings');else if(a==='open-credits')openPanel('credits');else if(a==='open-plans')openPanel('plans');else if(a==='open-models')openPanel('models');else if(a==='close-panel')closePanel();else if(a==='signout'){clearSession();signedInUser=null;await loadPlanTruth();loadSessions();closePanel();setStatus('Signed out','good')}});document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openPanel(el.dataset.open)));$('menuBtn').addEventListener('click',openSide);backdrop.addEventListener('click',closeSide);$('closePanel').addEventListener('click',closePanel);panelBackdrop.addEventListener('click',e=>{if(e.target===panelBackdrop)closePanel()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSide();closePanel()}});$('chatForm').addEventListener('submit',e=>{e.preventDefault();sendMessage(prompt.value)});prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(prompt.value)}});window.startPlanCheckout=startPlanCheckout;window.startCreditCheckout=startCreditCheckout;window.openCreditWallet=(amount=0)=>{if(amount)pendingCredit(amount);openPanel('credits')};window.sendMessage=sendMessage;
async function init(){signedInUser=store().user||null;if(token())await refreshSession();await loadPlanTruth();loadSessions();const q=new URLSearchParams(location.search);const prefill=q.get('prompt');if(prefill){prompt.value=prefill.slice(0,2000);setStatus('Ready','good')}await handlePendingIntents();setStatus('Ready','good');prompt.focus()}init();
})();
