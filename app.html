async function mobileControlReadScreen(askStellar=false){

async function mobileControlPerform(action){
  const plugin=mobileControlPlugin();

  const allowed=new Set(['back','home','scrollBackward','scrollForward','clickText','setText']);
  if(!allowed.has(action)){setStatus('That phone action is not allowed.','error');return}
  const target=action==='setText'?String($('mobile-control-field')?.value||'').trim():String($('mobile-control-target')?.value||'').trim();
  const value=String($('mobile-control-value')?.value||'');
  if(action==='clickText'&&!target){setStatus('Enter the visible text you want to tap.','warn');return}
  if(action==='setText'&&!value){setStatus('Enter the text you want Stellar to type.','warn');return}
  if(action==='clickText'&&!confirm('Tap the visible control matching “'+target.slice(0,160)+'”?'))return;
  if(action==='setText'&&!confirm('Type this text into the selected visible field?\\n\\n'+value.slice(0,240)))return;
  try{
    const result=await plugin.perform({action,target,value});
    mobileControlLastSnapshot=null;
    setStatus(result?.ok?'Phone action approved — switching to the target app if needed':'That action could not be started',result?.ok?'good':'warn');
    if(panelBackdrop.classList.contains('open'))setTimeout(()=>renderMobileControlPanel(),250);
  }catch(error){setStatus(String(error?.message||'Phone action failed.'),'error')}
}
