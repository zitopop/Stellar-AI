<body>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const side=$('side'),backdrop=$('backdrop'),panelBackdrop=$('panelBackdrop'),panelTitle=$('panelTitle'),panelIntro=$('panelIntro'),panelBody=$('panelBody'),chatInner=$('chatInner'),chatList=$('chatList'),chatEmpty=$('chatEmpty'),prompt=$('prompt'),statusEl=$('status'),sendBtn=$('sendBtn'),creditCount=$('creditCount'),accountButton=$('accountButton'),modelLabel=$('modelLabel'),voiceBtn=$('voiceBtn');
const SESSION_STORE_KEY='stellar-store';const MODELS={spark:'Spark',star:'Star',comet:'Comet',nova:'Nova'};const DEFAULT_COSTS={spark:2,star:5,comet:10,nova:20};const CREDIT_PACKS=new Map([[300,'£3 · 300 credits'],[500,'£5 · 525 credits'],[1000,'£10 · 1,100 credits'],[2500,'£25 · 2,875 credits'],[5000,'£50 · 6,000 credits'],[10000,'£100 · 12,000 credits'],[20000,'£200 · 24,000 credits']]);const UPGRADE_PLANS=new Set(['starter','plus','pro','starter-annual','plus-annual','pro-annual']);
let sessions=[],activeId='',busy=false,signedInUser=null,serverOwner=false,selectedModel=safeModel(localStorage.getItem('stellar-selected-model')||'star'),allowedModels=['spark','star'],planState={plan:'free',name:'Free',remaining:75,wallet:0,billing:{paid:false},costs:{...DEFAULT_COSTS}},voiceRecognition=null,voiceRunning=false;
function safeModel(v){v=String(v||'').toLowerCase();return MODELS[v]?v:'star'}function uid(){return 'c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}function now(){return Date.now()}function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}function setStatus(t,k='good'){statusEl.textContent=String(t||'');statusEl.className='status '+k}function storeState(){try{const v=JSON.parse(localStorage.getItem(SESSION_STORE_KEY)||'{}');return v&&typeof v==='object'?v:{}}catch{return {}}}function getSessionToken(){const t=storeState().session;return typeof t==='string'?t:''}function setSessionToken(token,user){const s=storeState();localStorage.setItem(SESSION_STORE_KEY,JSON.stringify({...s,session:String(token||''),user:user||s.user||null}))}function clearSessionToken(){const s=storeState();localStorage.setItem(SESSION_STORE_KEY,JSON.stringify({...s,session:'',user:null,owner:false}))}function authHeaders(json=true){const h=json?{'content-type':'application/json'}:{};const t=getSessionToken();if(t)h.Authorization='Bearer '+t;return h}function closeSide(){side.classList.remove('open');backdrop.classList.remove('open')}function openSide(){side.classList.add('open');backdrop.classList.add('open')}function closePanel(){panelBackdrop.classList.remove('open')}function fmt(n){return Number.isFinite(n)?Math.round(n).toLocaleString('en-GB'):'∞'}
function displayName(user){const email=String(user&&user.email||'').trim();const raw=String(user&&(user.name||user.given_name)||'').replace(/[._-]+/g,' ').trim();let name=raw.split(/\s+/)[0]||'';if(!name&&email)name=email.split('@')[0].replace(/[._-]+/g,' ');name=name.replace(/[^A-Za-z0-9À-ÿ'’ -]/g,'').trim();if(email.toLowerCase()==='deadlyfox10@gmail.com')return 'Tobi';return name?name.replace(/\b\w/g,c=>c.toUpperCase()):'Account'}function initials(user){return (displayName(user)||String(user&&user.email||'S')).slice(0,1).toUpperCase()}function totalCredits(){return serverOwner?Infinity:Math.max(0,Number(planState.remaining)||0)+Math.max(0,Number(planState.wallet)||0)}function accountKey(){const email=String(signedInUser&&signedInUser.email||'').trim().toLowerCase();return email||'guest'}function sessionsKey(){return 'stellar-chat-sessions:'+accountKey()}function legacyKey(){return 'stellar-lite-chat:'+accountKey()}
function defaultSession(){return{id:uid(),title:'New chat',messages:[],pinned:false,created:now(),updated:now()}}function sortSessions(){sessions.sort((a,b)=>(b.pinned-a.pinned)||(b.updated-a.updated))}function saveSessions(){sortSessions();localStorage.setItem(sessionsKey(),JSON.stringify(sessions.slice(0,60)))}function loadSessions(){try{sessions=JSON.parse(localStorage.getItem(sessionsKey())||'[]');if(!Array.isArray(sessions))sessions=[]}catch{sessions=[]}if(!sessions.length){try{const old=JSON.parse(localStorage.getItem(legacyKey())||'[]');if(Array.isArray(old)&&old.length)sessions=[{id:uid(),title:'Previous chat',messages:old,pinned:false,created:now(),updated:now()}]}catch{}}if(!sessions.length)sessions=[defaultSession()];activeId=sessions[0].id;saveSessions();renderAll()}function activeSession(){let s=sessions.find(x=>x.id===activeId);if(!s){s=sessions[0]||defaultSession();activeId=s.id;if(!sessions.includes(s))sessions.push(s)}return s}
function titleFrom(text){const t=String(text||'').trim().replace(/\s+/g,' ');return t?t.slice(0,46):'New chat'}function chatAge(ts){const d=Math.max(0,now()-Number(ts||now()));if(d<60000)return 'now';if(d<3600000)return Math.floor(d/60000)+'m';if(d<86400000)return Math.floor(d/3600000)+'h';return Math.floor(d/86400000)+'d'}
function renderChatList(){sortSessions();chatList.innerHTML='';chatEmpty.classList.toggle('hidden',sessions.length>0);for(const s of sessions){const row=document.createElement('button');row.type='button';row.className='chat-item'+(s.id===activeId?' active':'')+(s.pinned?' pinned':'');row.dataset.id=s.id;row.innerHTML='<span class="chat-main"><span class="chat-title">'+escapeHtml(s.title||'New chat')+'</span><span class="chat-meta">'+(s.pinned?'Pinned · ':'')+escapeHtml(chatAge(s.updated))+'</span></span><span class="chat-actions"><span class="icon-btn pin" title="Pin chat" aria-label="Pin chat">📌</span><span class="icon-btn rename" title="Rename chat" aria-label="Rename chat">✎</span><span class="icon-btn delete" title="Delete chat" aria-label="Delete chat" '+(s.pinned?'aria-disabled="true"':'')+'>⌫</span></span>';chatList.append(row)}}
function welcomeHtml(){return '<div class="welcome" id="welcome"><h1>'+escapeHtml(displayName(signedInUser))+', what can I help with?</h1><p>Chat first. Your saved chats are now visible in the sidebar with pin, rename and delete.</p></div>'}function renderMessages(){const s=activeSession();chatInner.innerHTML='';if(!s.messages.length){chatInner.innerHTML=welcomeHtml();return}for(const m of s.messages)addMessage(m.role,m.content,false)}function renderAll(){renderChatList();renderMessages();updateHeader()}function addMessage(role,text,scroll=true){const wrap=document.createElement('article');wrap.className='msg '+role;wrap.innerHTML='<div class="meta">'+(role==='user'?'You':'Stellar')+'</div><div class="bubble"></div>';wrap.querySelector('.bubble').textContent=String(text||'');chatInner.append(wrap);if(scroll)wrap.scrollIntoView({block:'end'});return wrap.querySelector('.bubble')}
function updateHeader(){const total=totalCredits();creditCount.textContent=Number.isFinite(total)?fmt(total):'∞';if(accountButton)accountButton.textContent=signedInUser?'Account':'Sign in';if(!allowedModels.includes(selectedModel))selectedModel=allowedModels.includes('star')?'star':(allowedModels[0]||'spark');localStorage.setItem('stellar-selected-model',selectedModel);if(modelLabel)modelLabel.textContent=MODELS[selectedModel]+' · '+(planState.costs[selectedModel]||DEFAULT_COSTS[selectedModel])+' credits'}
chatList.addEventListener('click',e=>{const row=e.target.closest('.chat-item');if(!row)return;const id=row.dataset.id;const s=sessions.find(x=>x.id===id);if(!s)return;if(e.target.closest('.pin')){s.pinned=!s.pinned;s.updated=now();saveSessions();renderChatList();setStatus(s.pinned?'Chat pinned':'Chat unpinned','good');return}if(e.target.closest('.rename')){const name=promptDialog('Rename chat',s.title||'New chat');if(name){s.title=name.slice(0,60);s.updated=now();saveSessions();renderChatList();setStatus('Chat renamed','good')}return}if(e.target.closest('.delete')){if(s.pinned){setStatus('Pinned chats are protected. Unpin first before deleting.','warn');return}sessions=sessions.filter(x=>x.id!==id);if(!sessions.length)sessions=[defaultSession()];if(activeId===id)activeId=sessions[0].id;saveSessions();renderAll();setStatus('Chat deleted','good');return}activeId=id;renderAll();closeSide()});function promptDialog(label,value){return window.prompt(label,value||'')?.trim()||''}
function newChat(){const s=defaultSession();sessions.unshift(s);activeId=s.id;saveSessions();renderAll();closeSide();setStatus('New chat ready','good');prompt.focus()}$('newChatBtn').addEventListener('click',newChat);
function parseReply(raw){let out='';for(const line of String(raw||'').split(/\r?\n/)){if(!line.startsWith('data:'))continue;const payload=line.slice(5).trim();if(!payload||payload==='[DONE]')continue;try{const ev=JSON.parse(payload);out+=ev?.delta?.text||ev?.delta||ev?.text||ev?.content||ev?.choices?.[0]?.delta?.content||''}catch{}}if(out)return out;try{const p=JSON.parse(raw);return p.reply||p.text||p.message||raw}catch{return raw}}
async function sendMessage(text){if(busy)return;const userText=String(text||'').trim();if(!userText){prompt.focus();setStatus('Type a message first.','warn');return}busy=true;sendBtn.disabled=true;const s=activeSession();if(!s.messages.length)s.title=titleFrom(userText);s.messages.push({role:'user',content:userText});s.updated=now();saveSessions();renderAll();const reply=addMessage('assistant','Thinking…');prompt.value='';setStatus('Thinking…','warn');try{const res=await fetch('/api/chat',{method:'POST',headers:authHeaders(),body:JSON.stringify({action:'chat',model:selectedModel,selectedModel,use_credit:Boolean(getSessionToken()),messages:s.messages.slice(-16),client:{source:'stellar-app-chat-history-v16'}})});const raw=await res.text();if(!res.ok){let err=raw;try{const p=JSON.parse(raw);err=p.error?.message||p.error||raw}catch{}throw new Error(String(err||'Chat failed'))}const answer=parseReply(raw).trim()||'Done.';reply.textContent=answer;s.messages.push({role:'assistant',content:answer});s.updated=now();saveSessions();renderChatList();setStatus('Ready','good');if(getSessionToken())loadPlanTruth()}catch(err){reply.textContent='I could not send that message. '+(err&&err.message||'Please try again.');setStatus('Send failed','error')}finally{busy=false;sendBtn.disabled=false;prompt.focus()}}
function settingsRow(icon,title,sub,action,href){const tag=href?'a':'button';const attrs=href?'href="'+href+'"':'type="button" data-action="'+action+'"';return '<'+tag+' class="settings-row" '+attrs+'><span class="ico">'+icon+'</span><span class="copy"><strong>'+escapeHtml(title)+'</strong><small>'+escapeHtml(sub)+'</small></span><span class="chev">›</span></'+tag+'>'}function planCard(name,price,credits,detail,plan,popular=false){const yearly=plan?plan+'-annual':'';return '<div class="plan '+(popular?'popular':'')+'"><strong>'+name+(price?' · '+price:'')+'</strong><small>'+credits+' · '+detail+'</small>'+(plan?'<div class="plan-actions"><button class="btn primary" type="button" data-action="plan-checkout" data-plan="'+plan+'">Choose monthly</button><button class="btn ghost" type="button" data-action="plan-checkout" data-plan="'+yearly+'">Choose yearly</button></div>':'')+'</div>'}
function renderPlansPanel(){panelTitle.textContent='Plans';panelIntro.textContent='Pick a plan. Checkout stays attached to your account.';panelBody.innerHTML='<div class="plans-grid">'+planCard('Free','£0','75 credits/day','Spark + Star','')+planCard('Starter','£8/mo','5,000 credits/month','Everyday users','starter')+planCard('Plus','£20/mo','15,000 credits/month','Best value for builders','plus',true)+planCard('Pro','£75/mo','50,000 credits/month','Serious work + Nova','pro')+'</div><p class="section-note">Tip: Plus is the main builder tier.</p>'}function renderCreditsPanel(){panelTitle.textContent='Credits';panelIntro.textContent='Included plan credits plus wallet top-ups.';if(!getSessionToken()){panelBody.innerHTML='<div class="grid"><div class="card"><strong>Sign in first</strong><small>Credits and purchases need an account.</small></div><button class="btn primary" type="button" data-action="open-account">Sign in or create account</button></div>';return}if(serverOwner){panelBody.innerHTML='<div class="grid"><div class="card"><strong>Owner credits</strong><small>Unlimited owner access.</small></div></div>';return}const opts=Array.from(CREDIT_PACKS.entries()).map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join('');panelBody.innerHTML='<div class="grid"><div class="card"><strong>'+escapeHtml(planState.name)+' included</strong><small>'+fmt(planState.remaining)+' credits remaining.</small></div><div class="card"><strong>Wallet</strong><small>'+fmt(planState.wallet)+' bought credits available.</small></div><div class="card"><strong>Total shown</strong><small>'+fmt(totalCredits())+' credits in the header.</small></div><div class="field"><label for="topupAmount">Choose top-up</label><select id="topupAmount">'+opts+'</select></div><div class="inline-actions"><button class="btn primary" type="button" data-action="credit-checkout">Continue to Stripe</button><a class="btn ghost" href="/plans#credits">Compare packs</a></div></div>'}
function renderModelsPanel(){panelTitle.textContent='Models';panelIntro.textContent='Paid plans unlock stronger models.';const order=['spark','star','comet','nova'];panelBody.innerHTML='<div class="grid">'+order.map(key=>{const allowed=allowedModels.includes(key),req=key==='comet'?'Plus or Pro':key==='nova'?'Pro':'Free+';return '<button class="settings-row" type="button" data-action="select-model" data-model="'+key+'" '+(allowed?'':'disabled')+'><span class="ico">'+(selectedModel===key?'✓':'●')+'</span><span class="copy"><strong>'+MODELS[key]+(selectedModel===key?' · selected':'')+'</strong><small>'+(planState.costs[key]||DEFAULT_COSTS[key])+' credits/message · '+(allowed?'Unlocked':'Locked · '+req)+'</small></span><span class="chev">'+(allowed?'Choose':'Locked')+'</span></button>'}).join('')+'</div>'}
function renderSettingsPanel(){panelTitle.textContent=signedInUser?'Account':'Settings';panelIntro.textContent=signedInUser?'Plan, credits and workspace controls.':'Sign in to sync plans, credits and purchases.';if(!signedInUser){panelBody.innerHTML='<div class="settings-sheet"><section class="account-card"><div class="account-top"><div class="avatar">S</div><div class="account-title"><strong>Welcome to Stellar</strong><small>Sign in to save chats, credits and purchases.</small></div><span class="badge">Guest</span></div><div class="stats"><div class="stat"><span>Free credits</span><strong>75/day</strong></div><div class="stat"><span>Models</span><strong>Spark + Star</strong></div><div class="stat"><span>Checkout</span><strong>Stripe</strong></div></div></section><section class="card"><div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="authPassword">Password</label><input id="authPassword" type="password" autocomplete="current-password" minlength="8" maxlength="100" placeholder="8+ characters"></div><div class="inline-actions"><button class="btn primary" type="button" data-action="email-login">Sign in</button><button class="btn ghost" type="button" data-action="email-signup">Create account</button></div><a class="btn ghost" style="margin-top:8px;width:100%" href="/api/discord-oauth">Continue with Discord</a></section><section class="settings-section"><h3>Help</h3>'+settingsRow('?','Account help','Forgot password, billing or login support.','', '/support#account-help')+settingsRow('§','Legal & privacy','Terms, privacy, refunds and cookies.','', '/legal')+'</section></div>';return}const email=escapeHtml(signedInUser.email||''),planName=escapeHtml(planState.name||'Free'),included=serverOwner?'Unlimited':fmt(planState.remaining),wallet=serverOwner?'Unlimited':fmt(planState.wallet),total=serverOwner?'∞':fmt(totalCredits()),badge=serverOwner?'Owner':planName;let html='<div class="settings-sheet"><section class="account-card"><div class="account-top"><div class="avatar">'+escapeHtml(initials(signedInUser))+'</div><div class="account-title"><strong>'+escapeHtml(displayName(signedInUser))+'</strong><small>'+email+'</small></div><span class="badge">'+badge+'</span></div><div class="stats"><div class="stat"><span>Plan</span><strong>'+planName+'</strong></div><div class="stat"><span>Total credits</span><strong>'+total+'</strong></div><div class="stat"><span>Model</span><strong>'+MODELS[selectedModel]+'</strong></div></div></section><section class="settings-section"><h3>Account</h3>'+settingsRow('£','Credits & top-ups',included+' included · '+wallet+' wallet credits.','open-credits')+(!serverOwner?settingsRow('◇','Upgrade plan','Compare Starter, Plus and Pro.','open-plans'):'')+settingsRow('?','Support','Billing, login or technical help.','', '/support')+'</section><section class="settings-section"><h3>Workspace</h3>'+settingsRow('●','Models','Choose Spark, Star, Comet or Nova.','open-models')+settingsRow('▣','Plugins','Connect supported tools and accounts.','', '/plugins')+settingsRow('💬','Chats','Pin, rename or delete chats from the sidebar.','close-settings')+'</section>';if(serverOwner)html+='<section class="settings-section"><h3>Owner tools</h3>'+settingsRow('J','Jarvis','Private owner assistant and calls.','', '/jarvis')+settingsRow('⇧','Deploy Center','Owner deployment controls.','', '/deploy')+'</section>';html+='<section class="settings-section"><h3>Privacy & legal</h3>'+settingsRow('§','Legal hub','Terms, privacy, refunds and acceptable use.','', '/legal')+settingsRow('🔒','Privacy','How Stellar handles account and app data.','', '/privacy')+'</section><div class="settings-footer"><button class="btn danger" type="button" data-action="signout">Sign out</button><button class="btn ghost" type="button" data-action="close-settings">Done</button></div></div>';panelBody.innerHTML=html}
function openPanel(kind){closeSide();panelBackdrop.classList.add('open');if(kind==='plans')renderPlansPanel();else if(kind==='credits')renderCreditsPanel();else if(kind==='models')renderModelsPanel();else renderSettingsPanel()}function selectModel(m){m=safeModel(m);if(!allowedModels.includes(m)){setStatus(MODELS[m]+' unlocks on a higher plan.','warn');return}selectedModel=m;updateHeader();renderModelsPanel();setStatus(MODELS[m]+' selected','good')}
async function emailAuth(mode){const email=String($('authEmail')?.value||'').trim().toLowerCase(),password=String($('authPassword')?.value||'');if(!email.includes('@')){setStatus('Enter a valid email.','error');return}if(password.length<8){setStatus('Password needs 8+ characters.','error');return}setStatus(mode==='signup'?'Creating account…':'Signing in…','warn');try{const res=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:mode,email,password})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.session)throw new Error(data.error||'Sign-in failed.');signedInUser=data.user||{email:data.email||email};setSessionToken(data.session,signedInUser);await loadPlanTruth();loadSessions();renderSettingsPanel();setStatus(mode==='signup'?'Account ready':'Signed in','good');await handlePendingIntents()}catch(err){setStatus(err.message||'Could not sign in.','error')}}async function refreshSession(){const token=getSessionToken();if(!token)return false;try{const res=await fetch('/api/auth',{method:'POST',headers:authHeaders(),body:JSON.stringify({action:'refreshSession'})});const data=await res.json().catch(()=>({}));if(res.status===401){clearSessionToken();signedInUser=null;return false}if(res.ok&&data.session){signedInUser=data.user||storeState().user||signedInUser;setSessionToken(data.session,signedInUser);return true}}catch{}return false}
async function loadPlanTruth(){const token=getSessionToken();if(!token){serverOwner=false;allowedModels=['spark','star'];planState={plan:'free',name:'Free',remaining:75,wallet:0,billing:{paid:false},costs:{...DEFAULT_COSTS}};updateHeader();return}try{const res=await fetch('/api/get-plan',{cache:'no-store',headers:authHeaders(false)});const data=await res.json().catch(()=>({}));if(res.status===401){clearSessionToken();signedInUser=null;await loadPlanTruth();return}if(!res.ok)throw new Error(data.error||'Could not load plan.');const account=data.accountPlan||{},caps=data.capabilities||account.capabilities||{},usage=data.usage||account.usage||{};serverOwner=data.owner===true||account.owner===true;allowedModels=(Array.isArray(data.availableModels)?data.availableModels:Array.isArray(account.availableModels)?account.availableModels:Array.isArray(caps.models)?caps.models:['spark','star']).map(safeModel);planState={plan:String(data.plan||data.planId||account.id||'free').toLowerCase(),name:String(data.planName||data.planLabel||account.name||caps.name||'Free'),remaining:serverOwner?0:Math.max(0,Number(usage.remaining??caps.includedCredits??75)||0),wallet:serverOwner?0:Math.max(0,Number(data.addOnCredits??data.walletCredits??account.addOnCredits??0)||0),billing:data.billing||account.billing||{paid:false},costs:caps.modelCreditCosts&&typeof caps.modelCreditCosts==='object'?caps.modelCreditCosts:{...DEFAULT_COSTS}};updateHeader()}catch(err){setStatus(err.message||'Could not refresh plan.','warn');updateHeader()}}
function pendingUpgradeIntent(v=''){const q=new URLSearchParams(location.search),p=String(v||q.get('upgrade')||sessionStorage.getItem('stellar-pending-upgrade')||'').toLowerCase();if(!UPGRADE_PLANS.has(p))return '';sessionStorage.setItem('stellar-pending-upgrade',p);return p}function pendingCreditIntent(v=0){const q=new URLSearchParams(location.search),a=Number(v||q.get('credits')||sessionStorage.getItem('stellar-pending-credit-pack')||0);if(!CREDIT_PACKS.has(a))return 0;sessionStorage.setItem('stellar-pending-credit-pack',String(a));return a}function removeQuery(keys){const q=new URLSearchParams(location.search);keys.forEach(k=>q.delete(k));history.replaceState(null,'',location.pathname+(q.toString()?'?'+q.toString():'')+location.hash)}async function startPlanCheckout(plan){plan=String(plan||'').toLowerCase();if(!UPGRADE_PLANS.has(plan)){setStatus('That plan is not available.','error');return}if(!getSessionToken()){pendingUpgradeIntent(plan);openPanel('settings');setStatus('Sign in first, then checkout continues.','warn');return}setStatus('Opening secure plan checkout…','warn');try{const res=await fetch('/api/create-checkout',{method:'POST',headers:authHeaders(),body:JSON.stringify({plan})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.url)throw new Error(data.error||'Checkout could not start.');const u=new URL(data.url);if(u.protocol!=='https:'||u.hostname!=='checkout.stripe.com')throw new Error('Unexpected checkout address.');sessionStorage.removeItem('stellar-pending-upgrade');removeQuery(['upgrade']);location.assign(u.href)}catch(err){setStatus(err.message||'Could not open checkout.','error')}}async function startCreditCheckout(amount){amount=Number(amount||$('topupAmount')?.value||0);if(!CREDIT_PACKS.has(amount)){setStatus('Choose a valid credit pack.','error');return}if(!getSessionToken()){pendingCreditIntent(amount);openPanel('settings');setStatus('Sign in first so credits attach to your account.','warn');return}setStatus('Opening secure credit checkout…','warn');try{const res=await fetch('/api/create-checkout',{method:'POST',headers:authHeaders(),body:JSON.stringify({plan:'topup',amount})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.url)throw new Error(data.error||'Credit checkout could not start.');const u=new URL(data.url);if(u.protocol!=='https:'||u.hostname!=='checkout.stripe.com')throw new Error('Unexpected checkout address.');sessionStorage.removeItem('stellar-pending-credit-pack');removeQuery(['credits']);location.assign(u.href)}catch(err){setStatus(err.message||'Could not open checkout.','error')}}async function handlePendingIntents(){const p=pendingUpgradeIntent(),c=pendingCreditIntent();if(!getSessionToken()){if(p||c)openPanel('settings');return}if(p)return startPlanCheckout(p);if(c)return startCreditCheckout(c)}
function consumeDiscordOAuthCallback(){const q=new URLSearchParams(location.search),f=new URLSearchParams(location.hash.slice(1));const encoded=f.get('discord_login')||q.get('discord_login'),token=f.get('discord_session'),display=f.get('discord_user')||q.get('discord_user');if(!encoded||!token)return false;try{const raw=encoded.replace(/-/g,'+').replace(/_/g,'/'),email=atob(raw.padEnd(Math.ceil(raw.length/4)*4,'=')).trim().toLowerCase();if(!email.includes('@'))throw new Error('bad');signedInUser={email,name:display?decodeURIComponent(display):'',discord:true};setSessionToken(token,signedInUser);q.delete('discord_login');q.delete('discord_user');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q.toString():''));setStatus('Signed in with Discord','good');return true}catch{clearSessionToken();return false}}
function toggleVoice(){const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec){setStatus('Voice input is not supported by this browser.','warn');return}if(voiceRunning&&voiceRecognition){voiceRecognition.stop();return}voiceRecognition=new Rec();voiceRecognition.lang='en-GB';voiceRecognition.interimResults=true;voiceRecognition.continuous=false;let finalText='';voiceRecognition.onstart=()=>{voiceRunning=true;voiceBtn.textContent='Listening…';voiceBtn.setAttribute('aria-pressed','true');setStatus('Listening…','warn')};voiceRecognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t;else interim+=t}prompt.value=(finalText+interim).trim()};voiceRecognition.onend=()=>{voiceRunning=false;voiceBtn.textContent='Voice';voiceBtn.setAttribute('aria-pressed','false');setStatus(prompt.value?'Voice ready to send.':'Ready','good')};voiceRecognition.start()}
panelBody.addEventListener('click',async e=>{const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action;if(a==='email-login')await emailAuth('login');else if(a==='email-signup')await emailAuth('signup');else if(a==='plan-checkout')await startPlanCheckout(t.dataset.plan);else if(a==='credit-checkout')await startCreditCheckout();else if(a==='select-model')selectModel(t.dataset.model);else if(a==='open-account')openPanel('settings');else if(a==='open-credits')openPanel('credits');else if(a==='open-plans')openPanel('plans');else if(a==='open-models')openPanel('models');else if(a==='close-settings')closePanel();else if(a==='signout'){clearSessionToken();signedInUser=null;await loadPlanTruth();loadSessions();renderSettingsPanel();setStatus('Signed out','good')}});
$('menuBtn').addEventListener('click',openSide);backdrop.addEventListener('click',closeSide);$('closePanel').addEventListener('click',closePanel);panelBackdrop.addEventListener('click',e=>{if(e.target===panelBackdrop)closePanel()});document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openPanel(el.dataset.open)));$('chatForm').addEventListener('submit',e=>{e.preventDefault();sendMessage(prompt.value)});prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(prompt.value)}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSide();closePanel()}});voiceBtn.addEventListener('click',toggleVoice);window.startPlanCheckout=startPlanCheckout;window.openCreditWallet=(amount=0)=>{if(amount)pendingCreditIntent(amount);openPanel('credits')};window.startCreditCheckout=startCreditCheckout;window.sendMessage=sendMessage;
async function init(){consumeDiscordOAuthCallback();if(getSessionToken()){signedInUser=storeState().user||signedInUser;await refreshSession()}await loadPlanTruth();loadSessions();await handlePendingIntents();setStatus('Ready','good');prompt.focus()}init();
})();
