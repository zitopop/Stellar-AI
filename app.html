.model-picker-note{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:10px 12px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:rgba(255,255,255,.025);color:#8f929a;font-size:11px}
.model-picker-dot{width:7px;height:7px;border-radius:999px;background:#72e3b5;box-shadow:0 0 0 4px rgba(114,227,181,.08)}
.model-grid{display:grid;gap:9px}
.model-card{width:100%;min-height:92px;display:grid;grid-template-columns:46px minmax(0,1fr) 30px;gap:12px;align-items:center;padding:12px 13px;border:1px solid rgba(255,255,255,.075);border-radius:16px;background:#151515;color:#f4f4f5;text-align:left;transition:border-color .15s ease,background .15s ease,transform .15s ease}
.model-card:hover,.model-card:focus-visible{border-color:rgba(167,139,250,.36);background:#1a1a1d;outline:0;transform:translateY(-1px)}
.model-card.selected{border-color:rgba(167,139,250,.55);background:linear-gradient(135deg,rgba(139,124,246,.14),rgba(255,255,255,.025));box-shadow:0 0 0 1px rgba(139,124,246,.05) inset}
.model-card.locked{border-style:dashed;background:#121212}
.model-card.locked:hover{border-style:solid;background:#18171d}
.model-card-icon{width:44px;height:44px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.09);border-radius:14px;background:linear-gradient(145deg,#22222a,#141418);color:#dcd7ff;font-size:13px;font-weight:900}
.model-card.selected .model-card-icon{border-color:rgba(167,139,250,.30);background:linear-gradient(145deg,rgba(139,124,246,.26),rgba(23,23,27,.95));color:#fff}
.model-card-copy{min-width:0;display:grid;gap:4px}
.model-card-top{display:flex;align-items:center;gap:7px;min-width:0}
.model-card-top strong{font-size:14px;line-height:1.2;letter-spacing:-.015em}
.model-card-badge{display:inline-flex;align-items:center;min-height:20px;padding:0 7px;border:1px solid rgba(255,255,255,.08);border-radius:999px;color:#a8a8b0;background:rgba(255,255,255,.025);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.model-card.selected .model-card-badge{border-color:rgba(167,139,250,.2);color:#d4ceff;background:rgba(139,124,246,.09)}
.model-card-copy small{display:block;color:#9a9aa2;font-size:11.5px;line-height:1.45}
.model-card-meta{color:#777780;font-size:10px;font-weight:700}
.model-card.locked .model-card-meta{color:#b8a9ff}
.model-card-state{display:grid;place-items:center;color:#a7a7ad;font-size:14px}
.model-card.selected .model-card-state{color:#9fe8c8}

}
@media(max-width:360px){
  .composer-main{grid-template-columns:44px minmax(0,1fr) 44px 44px!important}
}

function reportSnapshot(){

  const userMessages=sessions.reduce((total,session)=>total+(Array.isArray(session?.messages)?session.messages.filter(message=>message?.role==='user').length:0),0);
  const debugPrompts=sessions.reduce((total,session)=>total+(Array.isArray(session?.messages)?session.messages.filter(message=>message?.role==='user'&&message?.mode==='debug').length:0),0);

  const remaining=serverOwner?null:Math.max(0,Number(planState.remaining)||0);
  return {
    generatedAt:new Date().toISOString(),
    plan:String(planState.name||'Free'),
    limit,used,remaining,
    remainingPercent:serverOwner?100:usagePercent(),

    savedChats,userMessages,debugPrompts,
    currentModel:MODELS[selectedModel]||selectedModel,
    discordConnected:planState.discord?.connected===true,
    apiKeyConfigured:settingsApiKeyExists===true,
    weeklyUsage:planState.weeklyUsage||null,

  };
}
