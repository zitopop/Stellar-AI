function selectModel(m){m=safeModel(m);if(!allowedModels.includes(m)){setStatus('Locked on this plan','warn');return}selectedModel=m;updateHeader();renderModelsPanel();setStatus(MODELS[m]+' selected','good')}function openPanel(kind){panelReturnFocus=document.activeElement instanceof HTMLElement?document.activeElement:null;closeSide();panelBackdrop.classList.add('open');if(kind==='plans')renderPlansPanel();else if(kind==='credits')renderCreditsPanel();else if(kind==='models')renderModelsPanel();else renderSettingsPanel();setTimeout(()=>$('closePanel')?.focus(),0)}chatInner.addEventListener('click',async e=>{const button=e.target.closest('[data-message-action]');if(!button)return;if(button.dataset.messageAction==='copy')await copyAssistantResponse(button);else if(button.dataset.messageAction==='regenerate')await regenerateAssistantResponse(button)});$('export-chat-btn').addEventListener('click',exportCurrentChat);$('stellarx-btn').addEventListener('click',openComputerActionCard);window.addEventListener('offline',syncConnectivity);window.addEventListener('online',syncConnectivity);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('prompt')?.focus()}});panelBody.addEventListener('click',async e=>{const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action;if(a==='email-login')await emailAuth('login');else if(a==='email-signup')await emailAuth('signup');else if(a==='plan-checkout')await startPlanCheckout(t.dataset.plan);else if(a==='credit-checkout')await startCreditCheckout();else if(a==='select-model')selectModel(t.dataset.model);else if(a==='open-settings')openPanel('settings');else if(a==='open-credits')openPanel('credits');else if(a==='open-plans')openPanel('plans');else if(a==='open-models')openPanel('models');else if(a==='open-billing')await openBillingPortal();else if(a==='copy-referral')await copyReferralLink();else if(a==='share-referral')await shareReferralLink();else if(a==='launch-stellarx')launchComputerTask();else if(a==='call-owner')await triggerOwnerCall();else if(a==='call-health')await checkOwnerCallHealth();else if(a==='close-panel')closePanel();else if(a==='signout'){clearSession();signedInUser=null;await loadPlanTruth();loadSessions();closePanel();setStatus('Signed out','good')}});document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openPanel(el.dataset.open)));$('menuBtn').addEventListener('click',openSide);backdrop.addEventListener('click',closeSide);$('closePanel').addEventListener('click',closePanel);panelBackdrop.addEventListener('click',e=>{if(e.target===panelBackdrop)closePanel()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSide();closePanel()}});$('chatForm').addEventListener('submit',e=>{e.preventDefault();sendMessage(prompt.value)});prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(prompt.value)}});window.startPlanCheckout=startPlanCheckout;window.startCreditCheckout=startCreditCheckout;window.triggerOwnerCall=triggerOwnerCall;window.checkOwnerCallHealth=checkOwnerCallHealth;window.openBillingPortal=openBillingPortal;window.copyReferralLink=copyReferralLink;window.shareReferralLink=shareReferralLink;window.openComputerActionCard=openComputerActionCard;window.openCreditWallet=(amount=0)=>{if(amount)pendingCredit(amount);openPanel('credits')};window.sendMessage=sendMessage;
