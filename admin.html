<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Admin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, Inter, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 480px;
  }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p  { color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 28px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    color: #fff;
    font-size: 15px;
    margin-bottom: 20px;
    outline: none;
  }
  input:focus { border-color: rgba(16,163,127,0.6); }
  button {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    margin-bottom: 12px;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-green  { background: #10a37f; color: #000; }
  .btn-blue   { background: #3b82f6; color: #fff; }
  .btn-orange { background: #f59e0b; color: #000; }
  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 13px;
    white-space: pre-wrap;
    display: none;
    color: #10a37f;
  }
  .divider {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.08);
    margin: 24px 0;
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: .1em;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>✦ Stellar Admin</h1>
  <p>Owner tools — keep this page private</p>

  <label>Owner Secret</label>
  <input type="password" id="secret" placeholder="Your OWNER_SECRET value">

  <hr class="divider">
  <div class="section-title">💰 Credit Tools</div>

  <button class="btn-green" onclick="giveAll()">
    🎁 Give £1 to ALL existing users
  </button>

  <hr class="divider">
  <div class="section-title">👤 Single User</div>

  <label>Email</label>
  <input type="email" id="singleEmail" placeholder="user@example.com">

  <label>Amount (£)</label>
  <input type="number" id="singleAmount" placeholder="1" value="1" min="0.01" step="0.01">

  <button class="btn-blue" onclick="giveSingle()">
    ➕ Give credit to one user
  </button>

  <hr class="divider">
  <div class="section-title">👑 Grant Plan</div>

  <label>Email</label>
  <input type="email" id="planEmail" placeholder="user@example.com">

  <label>Plan</label>
  <select id="planSelect" style="width:100%;padding:14px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:12px;color:#fff;font-size:15px;margin-bottom:20px;outline:none;">
    <option value="free">Free</option>
    <option value="plus">Plus</option>
    <option value="pro">Pro</option>
  </select>

  <button class="btn-orange" onclick="grantPlan()">
    👑 Grant plan to user
  </button>

  <div class="result" id="result"></div>
</div>

<script>
  function getSecret() {
    const s = document.getElementById('secret').value.trim();
    if (!s) { showResult('❌ Enter your Owner Secret first!', true); return null; }
    return s;
  }

  function showResult(data, isError) {
    const el = document.getElementById('result');
    el.style.display = 'block';
    el.style.color = isError ? '#ef4444' : '#10a37f';
    el.textContent = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
  }

  async function callGrant(body) {
    try {
      const r = await fetch('/api/grant', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await r.json();
      showResult(data);
      return data;
    } catch (e) {
      showResult('❌ Error: ' + e.message, true);
    }
  }

  async function giveAll() {
    const secret = getSecret();
    if (!secret) return;
    showResult('⏳ Giving £1 to all users...');
    const data = await callGrant({ action: 'giveAllWelcomeCredit', secret });
    if (data?.ok) {
      showResult(`✅ Done!\n\nCredited: ${data.credited} users\nSkipped: ${data.skipped} (already had credit)\nTotal: ${data.total} users`);
    }
  }

  async function giveSingle() {
    const secret = getSecret();
    if (!secret) return;
    const email  = document.getElementById('singleEmail').value.trim();
    const amount = parseFloat(document.getElementById('singleAmount').value);
    if (!email) { showResult('❌ Enter an email!', true); return; }
    if (!amount || amount <= 0) { showResult('❌ Enter a valid amount!', true); return; }
    showResult('⏳ Adding credit...');
    await callGrant({ action: 'addCredit', email, amount, secret });
  }

  async function grantPlan() {
    const secret = getSecret();
    if (!secret) return;
    const email = document.getElementById('planEmail').value.trim();
    const plan  = document.getElementById('planSelect').value;
    if (!email) { showResult('❌ Enter an email!', true); return; }
    showResult('⏳ Granting plan...');
    await callGrant({ action: 'grantPlan', email, plan, secret });
  }
</script>
</body>
</html>
